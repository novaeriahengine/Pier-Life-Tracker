<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08131f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pier">
<link rel="manifest" href="./manifest.webmanifest">
<title>Pier Life Tracker</title>
<meta name="description" content="A deterministic personal life planner powered by GOAP-style rules, not an LLM.">
<style>
:root{
  --bg:#07111b;--bg2:#0b1723;--panel:#101e2c;--panel2:#142536;--panel3:#1a2d40;
  --text:#f3f8fc;--muted:#8fa5b8;--line:#24384a;--accent:#4fd1a5;--accent2:#65b7ff;
  --danger:#ff6b6b;--warn:#ffca63;--ok:#4fd1a5;--shadow:0 18px 50px rgba(0,0,0,.28);
  --radius:18px;--sidebar:245px;--top:70px;
}
[data-theme="light"]{
  --bg:#eef4f8;--bg2:#f6fafc;--panel:#ffffff;--panel2:#f5f9fb;--panel3:#edf4f8;
  --text:#102131;--muted:#667b8f;--line:#d7e2ea;--shadow:0 12px 32px rgba(36,67,91,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
strong{font-weight:750}
#authScreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:
 radial-gradient(circle at 15% 15%,rgba(79,209,165,.12),transparent 35%),
 radial-gradient(circle at 85% 10%,rgba(101,183,255,.12),transparent 32%),var(--bg)}
.auth-card{width:min(440px,100%);background:rgba(16,30,44,.92);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:-.03em;font-size:22px}
.logo-mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#06131d;font-weight:950;box-shadow:0 8px 24px rgba(79,209,165,.22)}
.auth-card h1{font-size:34px;line-height:1.05;margin:30px 0 8px;letter-spacing:-.04em}
.auth-card p{color:var(--muted);line-height:1.55;margin:0 0 24px}
.field{display:grid;gap:7px;margin:13px 0}
.field label{font-size:12px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px 13px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(101,183,255,.12)}
textarea{min-height:92px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:hover{transform:translateY(-1px);border-color:#3c5367}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#062017}
.btn.blue{background:var(--accent2);border-color:var(--accent2);color:#07131e}
.btn.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.35);color:#ff8c8c}
.btn.warn{background:rgba(255,202,99,.12);border-color:rgba(255,202,99,.35);color:var(--warn)}
.btn.ghost{background:transparent}
.btn.icon{width:38px;height:38px;padding:0}
.btn.wide{width:100%}
.auth-actions{display:flex;gap:10px;margin-top:18px}
.auth-actions .btn{flex:1}
.auth-links{display:flex;justify-content:space-between;gap:12px;margin-top:15px;font-size:12px}
.link-btn{border:0;background:none;color:var(--accent2);padding:0}
#appShell{min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);padding:18px 14px;border-right:1px solid var(--line);background:var(--bg2);z-index:20;display:flex;flex-direction:column}
.sidebar .logo{padding:4px 8px 18px}
.nav{display:grid;gap:5px;margin-top:10px}
.nav-btn{width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;display:flex;align-items:center;gap:11px;font-weight:700}
.nav-btn:hover{background:var(--panel);color:var(--text)}
.nav-btn.active{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav-icon{width:22px;text-align:center}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.sync-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.sync-row{display:flex;align-items:center;gap:8px;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(79,209,165,.1)}
.dot.bad{background:var(--danger)}
.main{margin-left:var(--sidebar);min-height:100vh}
.topbar{height:var(--top);position:sticky;top:0;z-index:15;background:rgba(7,17,27,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
[data-theme="light"] .topbar{background:rgba(238,244,248,.86)}
.topbar h2{font-size:19px;margin:0;letter-spacing:-.02em}
.topbar .spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 9px 6px 7px;max-width:220px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#07131e;display:grid;place-items:center;font-weight:900}
.user-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--muted)}
.content{padding:24px;max-width:1500px;margin:0 auto}
.setup-banner{background:rgba(255,202,99,.1);border:1px solid rgba(255,202,99,.32);color:#ffe1a0;border-radius:15px;padding:12px 14px;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
[data-theme="light"] .setup-banner{color:#775200}
.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 26px rgba(0,0,0,.08)}
.card.pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h3{margin:0;font-size:15px;letter-spacing:-.01em}
.hero-card{padding:24px;min-height:210px;background:
 linear-gradient(135deg,rgba(79,209,165,.10),transparent 45%),
 linear-gradient(315deg,rgba(101,183,255,.08),transparent 45%),var(--panel)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:850}
.hero-title{font-size:31px;line-height:1.08;margin:10px 0 8px;letter-spacing:-.04em}
.hero-sub{color:var(--muted);max-width:720px;line-height:1.5}
.next-action{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rank-bubble{min-width:46px;height:46px;border-radius:14px;background:var(--panel3);display:grid;place-items:center;font-weight:900}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.metric .value{font-size:24px;font-weight:850;margin-top:7px;letter-spacing:-.03em}
.metric .sub{font-size:11px;color:var(--muted);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plan-list,.stack{display:grid;gap:9px}
.plan-item,.task-row,.bill-row,.routine-row,.inbox-row{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.plan-num{width:30px;height:30px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}
.plan-body,.row-main{min-width:0;flex:1}
.plan-title,.task-title{font-weight:800;line-height:1.25}
.plan-reason,.row-meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:1px solid var(--line);padding:4px 8px;font-size:10px;font-weight:800;color:var(--muted);background:var(--panel)}
.pill.must{color:#ffd6d6;border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08)}
.pill.urgent{color:#ffe3aa;border-color:rgba(255,202,99,.35);background:rgba(255,202,99,.08)}
.pill.good{color:#bff6e3;border-color:rgba(79,209,165,.35);background:rgba(79,209,165,.08)}
.pill.blue{color:#c8e7ff;border-color:rgba(101,183,255,.35);background:rgba(101,183,255,.08)}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 16px}
.section-title h1{font-size:30px;margin:0;letter-spacing:-.04em}
.section-title p{margin:5px 0 0;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.task-board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.board-col{min-width:0}
.board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.board-head h3{margin:0;font-size:13px}
.count{min-width:25px;height:25px;padding:0 7px;border-radius:99px;background:var(--panel2);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.money-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.account-card{padding:16px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.account-card .amount{font-size:25px;font-weight:900;margin:8px 0}
.account-card .name{font-size:12px;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;background:var(--panel2)}
tr:last-child td{border-bottom:0}
.amount.income{color:var(--ok)}
.amount.expense{color:#ff9b9b}
.progress{height:8px;border-radius:999px;background:var(--panel3);overflow:hidden}
.progress>span{height:100%;display:block;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}
.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.goal-card{padding:17px}
.goal-top{display:flex;justify-content:space-between;gap:10px}
.goal-title{font-weight:850}
.goal-value{font-size:24px;font-weight:900;margin:16px 0 8px}
.goal-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-top:8px}
.empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px}
.quick-capture{display:flex;gap:8px}
.quick-capture input{flex:1}
.blocker{border-color:rgba(255,107,107,.38);background:rgba(255,107,107,.06)}
.priority-bar{width:5px;align-self:stretch;border-radius:9px;background:var(--muted)}
.priority-bar.p5{background:var(--danger)}.priority-bar.p4{background:var(--warn)}.priority-bar.p3{background:var(--accent2)}.priority-bar.p2{background:var(--accent)}.priority-bar.p1{background:var(--muted)}
.tabs{display:flex;gap:5px;background:var(--panel2);border:1px solid var(--line);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow:auto}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap}
.tab.active{background:var(--panel);color:var(--text)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.setting-row{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-row input,.setting-row select{width:160px}
.modal-backdrop{position:fixed;inset:0;background:rgba(1,8,14,.72);backdrop-filter:blur(7px);z-index:100;display:grid;place-items:center;padding:18px}
.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.modal-head{position:sticky;top:0;background:var(--panel);padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
.modal-head h3{margin:0}
.modal-body{padding:20px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;gap:9px;align-items:center;margin:12px 0;color:var(--text)}
.check input{width:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:9px;width:min(360px,calc(100% - 36px))}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);animation:toastin .18s ease-out}
.toast.error{border-color:rgba(255,107,107,.45)}.toast.ok{border-color:rgba(79,209,165,.45)}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mobile-nav{display:none}
.kbd{border:1px solid var(--line);background:var(--panel2);padding:2px 6px;border-radius:6px;font-size:10px;color:var(--muted)}
.split-line{height:1px;background:var(--line);margin:15px 0}
.right{text-align:right}
@media(max-width:1100px){
  .hero,.grid-2,.settings-grid{grid-template-columns:1fr}
  .task-board{grid-template-columns:1fr}
  .goal-grid,.account-grid{grid-template-columns:repeat(2,1fr)}
  .money-hero{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  :root{--sidebar:0px}
  .sidebar{display:none}
  .main{margin-left:0;padding-bottom:72px}
  .topbar{padding:0 14px}
  .content{padding:15px}
  .topbar .btn .desktop-label{display:none}
  .user-chip span{display:none}
  .mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;height:64px;background:rgba(11,23,35,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:800;display:grid;place-items:center;gap:2px}
  .mobile-nav button span{font-size:19px;line-height:1}
  .mobile-nav button.active{color:var(--accent)}
}
@media(max-width:600px){
  .hero-card{padding:19px}.hero-title{font-size:26px}
  .metrics{grid-template-columns:1fr 1fr}
  .goal-grid,.account-grid{grid-template-columns:1fr}
  .money-hero{grid-template-columns:1fr 1fr}
  .modal-grid{grid-template-columns:1fr}
  .section-title{align-items:flex-start;flex-direction:column}
  .toolbar{width:100%}.toolbar input,.toolbar select{width:100%}
}

/* Pier v2: household profiles, shadow worlds, work/pay, family life and paper markets */
.sidebar{overflow-y:auto}
.context-switcher{display:flex;align-items:center;gap:6px;margin-left:10px}
.context-switcher select{width:auto;max-width:160px;padding:8px 10px;border-radius:10px;font-size:11px;font-weight:800}
.context-switcher .world-shadow{border-color:rgba(170,120,255,.55);background:rgba(155,105,255,.14);color:#d9c4ff}
.shadow-strip{margin-bottom:16px;border:1px solid rgba(166,114,255,.45);background:linear-gradient(90deg,rgba(139,92,246,.14),rgba(101,183,255,.08));border-radius:14px;padding:11px 13px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.shadow-strip strong{color:#d9c4ff}
.context-badge{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:10px;font-weight:850}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.profile-card{padding:17px;position:relative;overflow:hidden}
.profile-card.active{border-color:rgba(79,209,165,.55);box-shadow:inset 0 0 0 1px rgba(79,209,165,.14)}
.profile-orb{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#07131e;font-weight:950;font-size:18px}
.work-clock{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(135deg,rgba(79,209,165,.08),rgba(101,183,255,.06)),var(--panel2)}
.clock-time{font-size:31px;font-weight:900;letter-spacing:-.04em}
.life-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.market-up{color:var(--ok)}.market-down{color:#ff8f8f}
.paper-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.schedule-row{border-left:3px solid var(--accent2)}
.person-chip{display:flex;gap:10px;align-items:center}
.person-dot{width:34px;height:34px;border-radius:12px;background:var(--panel3);display:grid;place-items:center;font-weight:900}
.inline-stat{display:flex;gap:5px;align-items:baseline}.inline-stat b{font-size:20px}
@media(max-width:1100px){.profile-grid{grid-template-columns:repeat(2,1fr)}.life-grid{grid-template-columns:1fr}.paper-hero{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.context-switcher{margin-left:0;flex:1}.context-switcher select{max-width:120px;min-width:0}.topbar h2{display:none}}
@media(max-width:600px){.profile-grid{grid-template-columns:1fr}.paper-hero{grid-template-columns:1fr 1fr}.shadow-strip{align-items:flex-start;flex-direction:column}}

/* Pier v2.1: calendar, planner explanations, true pay periods, stocks + options */
.calendar-shell{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--line);gap:1px}
.cal-head{background:var(--panel2);padding:9px;text-align:center;font-size:10px;font-weight:850;color:var(--muted);text-transform:uppercase}
.cal-day{min-height:112px;background:var(--panel);padding:8px;overflow:hidden}
.cal-day.other{opacity:.46}.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-num{font-size:11px;font-weight:850;margin-bottom:6px}
.cal-event{font-size:9px;line-height:1.25;padding:4px 5px;border-radius:6px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel3);border-left:3px solid var(--accent2)}
.cal-event.bill{border-color:var(--danger)}.cal-event.pay{border-color:var(--ok)}.cal-event.shift{border-color:var(--accent2)}.cal-event.task{border-color:var(--warn)}.cal-event.appt{border-color:#b48cff}
.timeline{display:grid;gap:8px;max-height:760px;overflow:auto}
.timeline-item{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.timeline-date{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.score-part{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:10px}
.plan-detail{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--panel2)}
.chart-wrap{height:180px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);display:grid;place-items:center;overflow:hidden}
.chart-wrap svg{width:100%;height:100%}
.watchlist{display:flex;gap:7px;flex-wrap:wrap}
.watch-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:850}
.contract{font-size:10px;color:var(--muted)}
@media(max-width:1100px){.calendar-shell{grid-template-columns:1fr}}
@media(max-width:700px){.cal-day{min-height:82px;padding:5px}.cal-event{font-size:8px;padding:3px}.score-grid{grid-template-columns:repeat(2,1fr)}}

/* Pier v2.2: personal pay coach + authenticated market data + training dataset */

function friendlyError(err){
  const c=err?.code||"";if(c.includes("invalid-credential"))return "Wrong email or password.";
  if(c.includes("email-already-in-use"))return "That email already has an account.";
  if(c.includes("weak-password"))return "Password needs at least 6 characters.";
  if(c.includes("configuration-not-found"))return "Firebase Authentication is not enabled yet. In Firebase open Authentication → Get started → Sign-in method → Email/Password → Enable, then try again.";
  if(c.includes("operation-not-allowed"))return "Email/Password sign-in is disabled. Firebase → Authentication → Sign-in method → Email/Password → Enable.";
  if(c.includes("unauthorized-domain"))return "Add novaeriahengine.github.io under Firebase Authentication → Settings → Authorized domains.";
  if(c.includes("permission-denied"))return "Firestore denied access. Enable Email/Password Auth and publish the included firestore.rules.";
  return err?.message||"Something failed.";
}

function stopListeners(){S.unsubs.forEach(u=>{try{u()}catch{}});S.unsubs=[]}
function startListeners(){
  stopListeners();S.syncError="";
  S.unsubs.push(onSnapshot(userDoc(),snap=>{if(snap.exists()){S.profile={...DEFAULT_PROFILE,...snap.data()};applyTheme();refresh();setTimeout(maybeAutoCheckLicense,400)}setSynced()},setSyncError));
  S.unsubs.push(onSnapshot(subcol("profiles"),snap=>{
    S.profiles=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(S.profiles.length&&!S.profiles.some(p=>p.id===S.activeProfileId)){S.activeProfileId=S.profiles[0].id;localStorage.setItem("pierProfile",S.activeProfileId)}
    updateContextUI();refresh();setSynced();
  },setSyncError));

    S.unsubs.push(onSnapshot(subcol(name),snap=>{
      S.all[name]=snap.docs.map(d=>({id:d.id,...d.data()}));
      applyContextData();refresh();setSynced();

function toTaskAction(t){return {key:"task:"+t.id,type:"task",id:t.id,title:t.title||"Untitled",priority:num(t.priority)||3,must:!!t.must,due:t.dueAt||"",minutes:Math.max(1,num(t.estimateMin)||15),cashCost:Math.max(0,num(t.moneyCost)),category:t.category||"General",requiresDriving:!!t.requiresDriving,lifeGroup:t.lifeGroup||""}}
function toBillAction(b){return {key:"bill:"+b.id,type:"bill",id:b.id,title:"Pay "+(b.name||"bill"),priority:num(b.priority)||5,must:true,due:b.dueDate||"",minutes:5,cashCost:Math.max(0,num(b.amount)),category:"Bill",lifeGroup:b.lifeGroup||""}}
function routineDue(r){
  if(!r.active)return false;const day=new Date().getDay();const days=Array.isArray(r.days)?r.days.map(Number):[];
  return (days.length===0||days.includes(day))&&r.lastCompletedDate!==today();
}
function toRoutineAction(r){return {key:"routine:"+r.id,type:"routine",id:r.id,title:r.name||"Routine",priority:num(r.priority)||3,must:!!r.must,due:today(),minutes:Math.max(1,num(r.estimateMin)||15),cashCost:0,category:"Routine",preferredTime:r.preferredTime||"",canOverlap:!!r.canOverlap,lifeGroup:r.lifeGroup||""}}
function toGoalAction(g){return {key:"goal:"+g.id,type:"goal",id:g.id,title:g.nextAction||("Work on "+g.name),priority:num(g.priority)||3,must:false,due:g.deadline||"",minutes:Math.max(1,num(g.nextActionMinutes)||30),cashCost:0,category:"Goal",lifeGroup:g.lifeGroup||""}}
function relationshipLastDone(personId=""){
  return S.relationshipPlans.filter(x=>x.status==="done"&&(!personId||x.personId===personId)&&x.completedDate).sort((a,b)=>String(b.completedDate).localeCompare(String(a.completedDate)))[0]||null;
}
function relationshipDaysSince(personId=""){
  const x=relationshipLastDone(personId);if(!x)return 21;
  return Math.max(0,Math.floor((new Date()-new Date(x.completedDate+"T12:00:00"))/86400000));
}
function relationshipAttention(personId=""){
  const days=relationshipDaysSince(personId),overdue=S.relationshipPlans.filter(x=>x.status!=="done"&&(!personId||x.personId===personId)&&x.targetDate&&daysUntil(x.targetDate)<0).length;
  return clamp(Math.round(days*4+overdue*18),0,100);
}
function toRelationshipAction(r){
  const attention=relationshipAttention(r.personId),d=daysUntil(r.targetDate);
  const priority=clamp(2+Math.floor(attention/25)+(d<=3?1:0),1,5);
  return {key:"relationship:"+r.id,type:"relationship",id:r.id,title:r.title||"Relationship plan",priority,must:d<0||attention>=80,due:r.targetDate||"",minutes:Math.max(10,num(r.minutes)||60),cashCost:Math.max(0,num(r.foundPrice||r.budget||0)),category:"Relationship"};
}

function relationshipMaintenanceAction(){
  const person=relationshipPerson(),pid=person?.id||"",attention=relationshipAttention(pid),open=S.relationshipPlans.some(r=>r.status!=="done"&&r.status!=="skipped"&&(!pid||r.personId===pid));
  if(open||attention<45)return null;
  return {key:"relationshipAuto:"+(pid||"partner"),type:"relationshipAuto",id:pid,title:"Choose or plan something for "+(person?.name||"your partner"),priority:clamp(2+Math.floor(attention/22),2,5),must:attention>=80,due:today(),minutes:30,cashCost:0,category:"Relationship",lifeGroup:"relationship-maintenance"};
}
function dedupeDailyActions(actions){
  const sorted=[...actions].sort((a,b)=>scoreAction(b)-scoreAction(a)),seen=new Set(),out=[];
  const fallback=a=>{
    const t=String((a.title||"")+" "+(a.category||"")).toLowerCase();
    if(/license|ticket|dmv/.test(t)&&/pay|payment|installment|down payment/.test(t))return "auto-license-payment";
    if(/license|reinstat/.test(t))return "auto-license-reinstatement";
    if(/concierge|more shifts|more work hours/.test(t))return "auto-work-hours";
    if(/iphone|phone upgrade|replace samsung/.test(t))return "auto-phone-upgrade";
    if(/apartment reset|room reset/.test(t))return "auto-home-reset";
    return "";
  };
  for(const a of sorted){
    const group=String(a.lifeGroup||fallback(a)||"").trim();
    if(group&&seen.has(group))continue;
    if(group)seen.add(group);
    out.push(a);
  }
  return out;
}

function moneyGigAction(){
  const target=Math.max(25,num(S.profile.weeklyIncomeTarget||100)),earned=weeklyGigIncome();
  if(earned>=target||!S.gigCatalogLoaded)return null;
  const gap=target-earned,active=S.gigPlans.find(x=>x.status==="active");
  if(active){
    const g=S.gigCatalog.find(x=>x.id===active.gigId);if(!g)return null;
    const already=openTasks().some(t=>t.gigId===g.id||t.lifeGroup==="gig:"+g.id);
    if(already)return null;
    const step=(g.steps||[])[Math.min(num(active.stepIndex),Math.max(0,(g.steps||[]).length-1))]||"Do the next paid step";
    return {key:"gigAuto:"+g.id,type:"gigAuto",id:g.id,title:"Money move: "+step,priority:4,must:false,due:today(),minutes:Math.max(20,Math.min(120,num(g.minutes||60))),cashCost:num(g.setupCost),category:"Gig / Income",lifeGroup:"gig:"+g.id,moneyGap:gap};
  }
  const g=topGigRecommendations(1)[0];if(!g)return null;
  return {key:"gigAuto:"+g.id,type:"gigAuto",id:g.id,title:"Start money experiment: "+g.title,priority:4,must:false,due:today(),minutes:30,cashCost:num(g.setupCost),category:"Gig / Income",lifeGroup:"gig:"+g.id,moneyGap:gap};
}
function allActions(){
  return [
    ...openTasks().filter(t=>t.plannerEnabled!==false).map(toTaskAction),
    ...S.bills.filter(b=>b.status!=="paid").map(toBillAction),
    ...S.routines.filter(routineDue).map(toRoutineAction),
    ...S.goals.filter(g=>g.status!=="done"&&g.nextAction&&g.plannerEnabled!==false).map(toGoalAction),
    ...S.relationshipPlans.filter(r=>r.status!=="done"&&r.status!=="skipped").map(toRelationshipAction),
    ...[relationshipMaintenanceAction(),moneyGigAction()].filter(Boolean)
  ];
}
function scoreAction(a){
  let score=(num(a.priority)||3)*14;const d=daysUntil(a.due);
  if(a.must)score+=85;
  if(d<0)score+=135+Math.min(70,Math.abs(d)*7);
  else if(d===0)score+=100;
  else if(d===1)score+=72;
  else if(d<=3)score+=48;
  else if(d<=7)score+=26;
  if(a.type==="bill")score+=24;if(a.type==="routine")score+=10;if(a.type==="relationship")score+=Math.floor(relationshipAttention()/5);if(a.type==="gigAuto")score+=32+Math.min(28,Math.floor(num(a.moneyGap)/5));
  if(a.minutes<=20)score+=5;
  return Math.round(score);
}
function whyAction(a){
  const r=[],d=daysUntil(a.due);
  if(a.must)r.push("HAVE TO");
  if(d<0)r.push(Math.abs(d)+"d overdue");else if(d===0)r.push("due today");else if(d===1)r.push("due tomorrow");else if(d<=7)r.push("due in "+d+"d");
  r.push("P"+(a.priority||3));r.push(a.minutes+" min");
  if(a.cashCost)r.push(money(a.cashCost));
  return r.join(" · ");
}


function scoreBreakdown(a){
  const d=daysUntil(a.due),parts=[];
  const priority=(num(a.priority)||3)*14;parts.push(["Priority P"+(a.priority||3),priority]);
  if(a.must)parts.push(["HAVE TO",85]);
  if(d<0)parts.push([Math.abs(d)+"d overdue",135+Math.min(70,Math.abs(d)*7)]);
  else if(d===0)parts.push(["Due today",100]);
  else if(d===1)parts.push(["Due tomorrow",72]);
  else if(d<=3)parts.push(["Due ≤3d",48]);
  else if(d<=7)parts.push(["Due ≤7d",26]);
  if(a.type==="bill")parts.push(["Bill",24]);
  if(a.type==="routine")parts.push(["Routine",10]);
  if(a.type==="relationship")parts.push(["Relationship cadence",Math.floor(relationshipAttention()/5)]);
  if(a.type==="gigAuto")parts.push(["Weekly money gap",32+Math.min(28,Math.floor(num(a.moneyGap)/5))]);
  if(a.minutes<=20)parts.push(["Quick win",5]);
  return parts;
}

    '<div class="money-hero">'+metric("Candidate actions",all.length,"Tasks + bills + routines + goals + money gigs")+metric("Selected today",p.selected.length,(p.initial.minutes-p.remaining.minutes)+" min scheduled")+metric("Blocked",p.blocked.length,"Not enough time or spendable cash")+metric("Spendable cash",money(p.initial.cash),"After protected reserve")+'</div>'+

function generatePlan(){
  const actions=allActions().sort((a,b)=>scoreAction(b)-scoreAction(a));
  const world={minutes:Math.max(30,num(S.profile.dailyMinutes)||240),cash:Math.max(0,availableMoney())};
  const initial={...world},selected=[],blocked=[];
  for(const a of actions){
    const urgent=daysUntil(a.due)<=num(S.profile.urgentDays);
    const worth=a.must||urgent||scoreAction(a)>=75;
    if(!worth)continue;
    const fail=[];
    if(a.cashCost>world.cash)fail.push("needs "+money(a.cashCost)+" but spendable cash is "+money(world.cash));
    if(a.requiresDriving&&String(S.profile.licenseStatus||"active").toLowerCase()==="suspended")fail.push("requires driving but license status is suspended");
    if(a.minutes>world.minutes)fail.push("needs "+a.minutes+" min but only "+world.minutes+" min remain");
    if(fail.length){
      if(a.must||urgent)blocked.push({...a,reason:fail.join("; "),score:scoreAction(a)});
      continue;
    }
    selected.push({...a,score:scoreAction(a),reason:whyAction(a)});
    world.minutes-=a.minutes;world.cash-=a.cashCost;
  }
  return {selected,blocked,initial,remaining:world,generatedAt:new Date()};
}

async function checkLicenseStatus(){
  const number=String(S.profile.driverLicenseNumber||"").trim(),backend=String(S.profile.licenseCheckBackendUrl||"").trim();
  if(!number)return toast("Save your Florida driver license number first.","error");
  if(!backend){
    await setDoc(userDoc(),{licenseStatus:"unavailable",licenseStatusSource:"backend-not-configured",licenseLastCheckedAt:new Date().toISOString(),licenseLastMessage:"Automatic checker backend is not configured."},{merge:true});
    return toast("Automatic checker backend is not configured. Use the official FLHSMV link or add your backend URL.","error");
  }
  try{
    toast("Checking Florida license status…");
    const idToken=await S.user.getIdToken();
    const r=await fetch(backend,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},body:JSON.stringify({state:"FL",driverLicenseNumber:number})});
    let data={};try{data=await r.json()}catch{}
    if(!r.ok)throw new Error(data.message||("Checker returned HTTP "+r.status));
    let status=String(data.status||data.licenseStatus||"unavailable").toLowerCase();
    if(!["active","suspended","restricted","unavailable","unknown"].includes(status))status="unavailable";
    await setDoc(userDoc(),{
      licenseStatus:status,licenseStatusSource:"automatic-backend",
      licenseLastCheckedAt:data.checkedAt||new Date().toISOString(),
      licenseLastMessage:String(data.message||data.detail||""),
      licenseLastError:""
    },{merge:true});
    toast("License status: "+status.toUpperCase());
  }catch(e){
    await setDoc(userDoc(),{licenseStatus:"unavailable",licenseStatusSource:"automatic-backend",licenseLastCheckedAt:new Date().toISOString(),licenseLastError:friendlyError(e)},{merge:true});
    toast("License check unavailable: "+friendlyError(e),"error");
  }
}

function gigRequirementResult(g){
  const caps=gigCapabilities(),missing=[];
  for(const r of (g.requirements||[])){
    const key=String(r);const low=key.toLowerCase();
    if(["phone","laptop","internet","quietspace","coding","sales","organization","communication","games","language","teaching","research","content","voice","concierge","testing","web"].includes(low)){
      const mapKey=low==="quietspace"?"quietSpace":low;
      if(!caps[mapKey])missing.push(key);
    }
  }
  if(num(g.setupCost)>Math.max(0,availableMoney()))missing.push("needs "+money(g.setupCost)+" setup cash");
  return {unlocked:missing.length===0,missing};
}
function gigAttemptsFor(id){return S.gigAttempts.filter(x=>x.gigId===id)}
function gigQ(id){
  const rows=gigAttemptsFor(id).slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
  let q=0;const alpha=.25;
  for(const x of rows){
    const net=num(x.earned)-num(x.cost),timePenalty=Math.max(0,num(x.minutes)/60*2),leadBonus=Math.min(10,num(x.leads)*1.5),reward=net-timePenalty+leadBonus;
    q=q+alpha*(reward-q);
  }
  return q;
}
function gigFitScore(g){
  const r=gigRequirementResult(g);let score=r.unlocked?55:10;
  const lane=g.lane||"build";if(lane==="fast")score+=20;else if(lane==="steady")score+=14;else if(lane==="foundation")score+=8;else score+=4;
  score+=Math.max(0,20-num(g.firstMoneyDays||30));
  if(num(g.weeklyMin)>=100)score+=10;
  if(num(g.setupCost)===0)score+=8;
  score+=clamp(gigQ(g.id)/5,-20,30);
  if(weeklyGigIncome()<num(S.profile.weeklyIncomeTarget||100))score+=10;
  return Math.round(score);
}

function categorySpendForMonth(){
  const ym=today().slice(0,7),map={};
  S.transactions.filter(t=>t.type==="expense"&&String(t.date||"").startsWith(ym)).forEach(t=>map[t.category||"Other"]=(map[t.category||"Other"]||0)+num(t.amount));
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function smokeSpendMonth(){
  const ym=today().slice(0,7);return S.transactions.filter(t=>t.type==="expense"&&String(t.date||"").startsWith(ym)&&/smok|cannabis/i.test(t.category||"")).reduce((n,t)=>n+num(t.amount),0);
}

function smokeStats(date){
  const rows=S.smokeLogs.filter(x=>(x.date||String(x.startedAt||"").slice(0,10))===date),physical=rows.reduce((n,x)=>n+num(x.units||1),0);
  const mine=rows.filter(x=>x.who==="me"||x.who==="together").reduce((n,x)=>n+num(x.units||1),0);
  const partner=rows.filter(x=>x.who==="partner"||x.who==="together").reduce((n,x)=>n+num(x.units||1),0);
  const shared=rows.filter(x=>x.who==="together").reduce((n,x)=>n+num(x.units||1),0);
  return {rows,physical,mine,partner,shared};
}

function hashText(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}

async function saveAiSnapshot(history=false){

  try{
    const payload=buildAiDataPack(),body=JSON.stringify(payload),hash=hashText(body),key="pier-ai-hash-"+S.activeProfileId+"-"+S.worldMode;
    if(!history&&localStorage.getItem(key)===hash)return;
    const id=history?idSafe("snapshot_"+Date.now()):aiSnapshotId();
    await setDoc(subdoc("aiSnapshots",id),{kind:history?"history":"current",hash,payload,generatedAt:payload.generatedAt,...ctxFields(),createdAt:serverTimestamp()},{merge:true});
    localStorage.setItem(key,hash);
    if(history)toast("AI-ready life snapshot saved to Firebase.");
  }finally{S.aiSnapshotBusy=false}
}

const BILL_CATEGORY_WEIGHT={housing:95,utilities:82,childcare:80,food:75,medical:72,transport:70,insurance:68,debt:42,subscription:8,other:25};
const BILL_CONSEQUENCE_WEIGHT={critical:90,high:55,normal:20,low:0};
function expectedIncomeEvents(days=45){
  const end=new Date(Date.now()+days*86400000),events=[];
  S.jobs.forEach(j=>payDateSeries(j,today(),end.toISOString().slice(0,10)).forEach(date=>{
    const est=estimatePay(j);events.push({date,amount:est.net,source:j.name,type:"estimated"});
  }));
  return events.sort((a,b)=>a.date.localeCompare(b.date));
}
function billPriorityBreakdown(b){
  const parts=[],d=daysUntil(b.dueDate),cat=BILL_CATEGORY_WEIGHT[b.billCategory||"other"]||25,cons=BILL_CONSEQUENCE_WEIGHT[b.consequence||"normal"]||20;
  parts.push(["Category importance",cat]);parts.push(["Unpaid consequence",cons]);parts.push(["Manual priority",(num(b.priority)||3)*10]);
  if(d<0)parts.push([Math.abs(d)+" days overdue",130+Math.min(60,Math.abs(d)*8)]);
  else if(d===0)parts.push(["Due today",110]);
  else if(d===1)parts.push(["Due tomorrow",90]);
  else if(d<=3)parts.push(["Due within 3 days",70]);
  else if(d<=7)parts.push(["Due this week",45]);
  else if(d<=14)parts.push(["Due within 2 weeks",20]);
  if(num(b.lateFee)>0)parts.push(["Late-fee exposure",Math.min(35,5+num(b.lateFee)/5)]);
  return parts;
}
function billPriorityScore(b){return Math.round(billPriorityBreakdown(b).reduce((a,x)=>a+x[1],0))}
function payCoachPlan(){
  const bills=S.bills.filter(b=>b.status!=="paid").map(b=>({...b,coachScore:billPriorityScore(b),coachParts:billPriorityBreakdown(b)})).sort((a,b)=>b.coachScore-a.coachScore);
  let cash=Math.max(0,availableMoney()),virtualCash=cash;
  const incomes=expectedIncomeEvents(45),recommendations=[];
  for(const b of bills){
    const dueAmount=num(b.minimumDue)>0?Math.min(num(b.amount),num(b.minimumDue)):num(b.amount),d=daysUntil(b.dueDate);
    let action="SHORTFALL",when="",reason=[];
    if(virtualCash>=dueAmount){action="PAY NOW";virtualCash-=dueAmount;reason.push("fits inside current spendable cash after reserve")}
    else{
      const inc=incomes.find(x=>x.date<=b.dueDate&&x.amount>0);
      if(inc){action="WAIT FOR PAYDAY";when=inc.date;reason.push("estimated "+money(inc.amount)+" from "+inc.source+" before this due date")}
      else if(b.partialAllowed&&virtualCash>0){action="PARTIAL";reason.push("full/minimum amount does not fit, but this bill allows partial payment")}
      else reason.push("current spendable cash is "+money(virtualCash)+" and no estimated payday covers it before due date");
    }
    if((b.billCategory||"other")==="housing")reason.push("housing is protected with the highest category weight");
    if(["critical","high"].includes(b.consequence))reason.push((b.consequence||"normal")+" consequence if missed");
    if(d<0)reason.push("already overdue"); else if(d<=3)reason.push("deadline is very close");
    if(num(b.lateFee)>0)reason.push("possible "+money(b.lateFee)+" late fee");
    recommendations.push({...b,dueAmount,action,when,reason,remainingAfter:virtualCash});
  }
  return {startCash:cash,incomes,recommendations};
}

  const p=payCoachPlan(),r=p.recommendations[0];
  if(!r)return '<div class="empty">Add your bills and Pier will tell you what deserves attention first.</div>';

function payDateSeries(job,start,end){
  if(!job?.nextPayDate)return [];
  const out=[],step=frequencyDays(job.payFrequency),d=new Date(job.nextPayDate+"T12:00:00"),s=new Date(start+"T00:00:00"),e=new Date(end+"T23:59:59");
  let guard=0;
  while(d>s&&guard++<200){if(job.payFrequency==="monthly")d.setMonth(d.getMonth()-1);else d.setDate(d.getDate()-step)}
  guard=0;
  while(d<=e&&guard++<300){
    if(d>=s)out.push(d.toISOString().slice(0,10));
    if(job.payFrequency==="monthly")d.setMonth(d.getMonth()+1);else d.setDate(d.getDate()+step);
  }
  return out;
}
function calendarEvents(start,end){
  const ev=[];
  S.tasks.filter(t=>t.dueAt).forEach(t=>ev.push({date:String(t.dueAt).slice(0,10),kind:"task",title:t.title,meta:t.status==="done"?"done":"task"}));
  S.bills.filter(b=>b.dueDate).forEach(b=>ev.push({date:b.dueDate,kind:"bill",title:(b.status==="paid"?"Paid ":"Bill ")+b.name,meta:money(b.amount)}));
  S.shifts.forEach(s=>ev.push({date:s.date,kind:"shift",title:jobName(s.jobId)+" "+s.start+"–"+s.end,meta:shiftHours(s).toFixed(1)+"h"}));
  S.appointments.filter(a=>a.dateTime).forEach(a=>ev.push({date:String(a.dateTime).slice(0,10),kind:"appt",title:a.title,meta:a.person||""}));
  S.timeBlocks.forEach(b=>ev.push({date:b.date,kind:"task",title:(b.start?b.start+" ":"")+b.title,meta:b.type||"time block"}));
  S.relationshipPlans.filter(r=>r.targetDate&&r.status!=="done").forEach(r=>ev.push({date:r.targetDate,kind:"appt",title:"♡ "+r.title,meta:relationshipPersonName(r.personId)}));
  S.dailyDrafts.filter(d=>d.date&&d.status==="pending").forEach(d=>ev.push({date:d.date,kind:"task",title:"GOAP draft · "+d.title,meta:(d.start||"")+"–"+(d.end||"")+" · pending approval"}));
  const smokeBy={};S.smokeLogs.forEach(x=>{const d=x.date||String(x.startedAt||"").slice(0,10);if(!d)return;(smokeBy[d]||(smokeBy[d]={units:0,sessions:0}));smokeBy[d].units+=num(x.units||1);smokeBy[d].sessions++});
  Object.entries(smokeBy).forEach(([date,x])=>ev.push({date,kind:"appt",title:"Smoke log · "+x.units+" unit(s)",meta:x.sessions+" session(s)"}));
  relationshipOpportunityDays(3).forEach(x=>ev.push({date:x.date,kind:"appt",title:"♡ Good relationship window",meta:"projected spendable "+money(x.cash)}));
  S.paychecks.forEach(p=>ev.push({date:p.payDate,kind:"pay",title:"Paid "+money(p.netAmount),meta:jobName(p.jobId)}));
  S.jobs.forEach(j=>payDateSeries(j,start,end).forEach(d=>ev.push({date:d,kind:"pay",title:"Expected payday",meta:j.name})));
  return ev.filter(x=>x.date>=start&&x.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
}

function normalizeLifePayload(payload){

function relationshipOpportunityDays(limit=4){
  const out=[],now=new Date();
  for(let i=1;i<=30;i++){
    const d=new Date(now);d.setDate(d.getDate()+i);const key=d.toISOString().slice(0,10),cash=projectedSpendableDate(key);
    const shiftHoursTotal=S.shifts.filter(s=>s.date===key).reduce((a,s)=>a+shiftHours(s),0),appt=S.appointments.filter(a=>String(a.dateTime||"").slice(0,10)===key).length;
    const weekend=[0,6].includes(d.getDay()),score=cash/8+(weekend?35:0)-shiftHoursTotal*7-appt*20;
    out.push({date:key,cash,score,shiftHours:shiftHoursTotal});
  }
  return out.filter(x=>x.cash>=20).sort((a,b)=>b.score-a.score).filter((x,i,a)=>a.slice(0,i).every(y=>Math.abs((new Date(x.date)-new Date(y.date))/86400000)>=3)).slice(0,limit).sort((a,b)=>a.date.localeCompare(b.date));
}

function timeToMin(v){if(!v)return 0;const [h,m]=String(v).split(":").map(Number);return h*60+(m||0)}
function minToTime(v){v=Math.max(0,Math.min(1439,Math.round(v)));return String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0")}

function feedbackFor(sourceKey){return S.goapFeedback.find(x=>x.sourceKey===sourceKey)||null}
function learnedAction(a){
  const f=feedbackFor(a.key);if(!f)return {...a,learnedBoost:0,learnedFrom:0};
  const approvals=num(f.approvedCount),rejects=num(f.rejectedCount),corrections=num(f.correctedCount);
  const boost=Math.max(-35,Math.min(35,approvals*4-rejects*7+corrections*2));
  const preferred=Number.isFinite(Number(f.avgStartMin))?minToTime(num(f.avgStartMin)):(a.preferredTime||"");
  const mins=Number.isFinite(Number(f.avgDurationMin))&&num(f.avgDurationMin)>=10?Math.round(num(f.avgDurationMin)):(a.minutes||30);
  return {...a,preferredTime:preferred,minutes:mins,learnedBoost:boost,learnedFrom:approvals+rejects+corrections};
}
function learnedScore(a){const x=learnedAction(a);return scoreAction(x)+num(x.learnedBoost)}
async function recordGoapFeedback(sourceKey,outcome,start="",end=""){
  if(!sourceKey)return;
  const current=feedbackFor(sourceKey)||{},approved=num(current.approvedCount),rejected=num(current.rejectedCount),corrected=num(current.correctedCount);
  const startMin=start?timeToMin(start):null,duration=start&&end?Math.max(10,timeToMin(end)-timeToMin(start)):null;
  let samples=num(current.timeSamples),avgStart=Number.isFinite(Number(current.avgStartMin))?num(current.avgStartMin):null,avgDur=Number.isFinite(Number(current.avgDurationMin))?num(current.avgDurationMin):null;
  if(startMin!==null&&duration!==null){
    avgStart=avgStart===null?startMin:(avgStart*samples+startMin)/(samples+1);
    avgDur=avgDur===null?duration:(avgDur*samples+duration)/(samples+1);
    samples++;
  }
  await setDoc(subdoc("goapFeedback",idSafe(sourceKey)),{
    sourceKey,
    approvedCount:approved+(outcome==="approved"?1:0),
    rejectedCount:rejected+(outcome==="rejected"?1:0),
    correctedCount:corrected+(outcome==="corrected"?1:0),
    avgStartMin:avgStart,
    avgDurationMin:avgDur,
    timeSamples:samples,
    lastOutcome:outcome,
    lastDate:today(),
    ...ctxFields(),
    updatedAt:serverTimestamp()
  },{merge:true});
}

async function ensureDailyDrafts(date,force=false){
  if(S.dailyDraftBusy||!S.user)return;
  if(date!==today()&&!force)return;
  S.dailyDraftBusy=true;
  try{
    let existing=dailyDraftsFor(date);
    if(force){
      for(const d of existing.filter(x=>x.status==="pending"))await deleteDoc(subdoc("dailyDrafts",d.id));
      existing=existing.filter(x=>x.status!=="pending");
    }
    const rows=autoDaySuggestions(date),sourceSet=new Set(existing.map(x=>x.sourceKey));
    let made=0;
    for(const x of rows){
      if(sourceSet.has(x.autoSourceKey))continue;
      const a=learnedAction(x.action||{key:x.autoSourceKey,priority:3,minutes:30});
      await addDoc(subcol("dailyDrafts"),{
        date,sourceKey:x.autoSourceKey,sourceType:(x.action?.type||"action"),sourceId:(x.action?.id||""),
        title:x.title,start:x.start,end:x.end,minutes:Math.max(10,timeToMin(x.end)-timeToMin(x.start)),
        score:learnedScore(x.action||{key:x.autoSourceKey,priority:3,minutes:30}),reason:x.meta,
        learnedFrom:num(a.learnedFrom),status:"pending",generation:"GOAP-v1",...ctxFields(),createdAt:serverTimestamp()
      });made++;
    }
    if(made&&force)toast(made+" daily suggestion"+(made===1?"":"s")+" generated.");
  }catch(e){console.warn("daily drafts",e)}
  finally{S.dailyDraftBusy=false}
}

function autoDaySuggestions(date){
  const occupied=fixedDayEvents(date).filter(x=>x.fixed&&x.start).map(x=>({s:timeToMin(x.start),e:timeToMin(x.end||minToTime(timeToMin(x.start)+60))})).sort((a,b)=>a.s-b.s);
  let dayStart=360,dayEnd=1380;
  if(date===today()){const n=new Date(),now=n.getHours()*60+n.getMinutes();dayStart=Math.max(dayStart,Math.ceil(now/15)*15)}
  const usedKeys=new Set(S.timeBlocks.filter(b=>b.date===date&&b.autoSourceKey).map(b=>b.autoSourceKey));
  const dateMs=new Date(date+"T23:59:59").getTime();
  const candidates=dedupeDailyActions(allActions()).filter(a=>{
    if(usedKeys.has(a.key))return false;
    const due=a.due?new Date(String(a.due).length<=10?a.due+"T23:59:59":a.due).getTime():Infinity;
    return a.must||due<=dateMs+7*86400000||scoreAction(a)>=90;
  }).map(learnedAction).sort((a,b)=>learnedScore(b)-learnedScore(a)).slice(0,10);
  const out=[],busy=[...occupied];
  function slot(minutes,preferred="",canOverlap=false){
    if(preferred){
      const ps=timeToMin(preferred),pe=ps+minutes;
      if(ps>=dayStart&&pe<=dayEnd&&(canOverlap||!busy.some(b=>ps<b.e&&pe>b.s)))return ps;
    }
    let t=dayStart;
    const sorted=()=>busy.sort((a,b)=>a.s-b.s);
    for(const b of sorted()){if(t+minutes<=b.s)return t;if(t<b.e)t=b.e+15}
    return t+minutes<=dayEnd?t:null;
  }
  for(const a of candidates){
    const mins=Math.max(10,Math.min(180,Math.ceil(a.minutes/15)*15)),s=slot(mins,a.preferredTime||"",a.canOverlap);if(s===null)continue;
    const e=s+mins;busy.push({s,e});out.push({start:minToTime(s),end:minToTime(e),title:a.title,kind:"auto",meta:"AUTO · score "+learnedScore(a)+" · "+whyAction(a)+(a.learnedFrom?" · learned from "+a.learnedFrom+" prior choice(s)":""),autoSourceKey:a.key,action:a});
  }
  return out;
}

function cloneDataObject(d,pid,world){

  x.profileId=pid;x.world=world;if(world==="shadow"&&sourceId)x.sourceLiveId=sourceId;
  x.updatedAt=serverTimestamp();x.createdAt=serverTimestamp();return x;
}
function shadowIdentity(name,d){
  if(d.sourceLiveId)return "src:"+d.sourceLiveId;
  if(name==="tasks")return "task:"+(d.title||"")+"|"+(d.dueAt||"");
  if(name==="bills")return "bill:"+(d.name||"")+"|"+(d.dueDate||"");
  if(name==="goals")return "goal:"+(d.name||"");
  if(name==="routines")return "routine:"+(d.name||"");
  if(name==="appointments")return "appt:"+(d.title||"")+"|"+(d.dateTime||"");
  if(name==="shifts")return "shift:"+(d.date||"")+"|"+(d.start||"")+"|"+(d.end||"")+"|"+(d.jobId||"");
  if(name==="relationshipPlans")return "rel:"+(d.title||"")+"|"+(d.targetDate||"");
  if(name==="timeBlocks")return "block:"+(d.title||"")+"|"+(d.date||"")+"|"+(d.start||"");
  if(name==="household")return "person:"+(d.name||"")+"|"+(d.relation||"");
  if(name==="jobs")return "job:"+(d.name||"");
  return "";
}
async function syncShadowMissing(pid){
  const names=["tasks","bills","goals","routines","appointments","shifts","relationshipPlans","timeBlocks","household","jobs","shopping"];
  let added=0;
  for(const name of names){
    const live=(S.all[name]||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="live");
    const shadow=(S.all[name]||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="shadow");
    const ids=new Set(shadow.map(d=>d.sourceLiveId?"src:"+d.sourceLiveId:shadowIdentity(name,d)).filter(Boolean));
    for(const d of live){
      const key="src:"+d.id,legacy=shadowIdentity(name,d);
      if(ids.has(key)||ids.has(legacy))continue;
      await addDoc(subcol(name),cloneDataObject(d,pid,"shadow"));added++;
    }
  }
  if(added)toast(added+" new LIVE item"+(added===1?"":"s")+" copied into SHADOW.");
}
async function syncShadowMoney(pid){
  const oldAccounts=(S.all.accounts||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="shadow");
  const oldTx=(S.all.transactions||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="shadow");
  for(const d of oldTx)await deleteDoc(subdoc("transactions",d.id));
  for(const d of oldAccounts)await deleteDoc(subdoc("accounts",d.id));
  const accountMap={};
  const liveAccounts=(S.all.accounts||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="live");
  for(const d of liveAccounts){const r=await addDoc(subcol("accounts"),cloneDataObject(d,pid,"shadow"));accountMap[d.id]=r.id}
  const liveTx=(S.all.transactions||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="live");
  for(const d of liveTx){const x=cloneDataObject(d,pid,"shadow");if(accountMap[x.accountId])x.accountId=accountMap[x.accountId];await addDoc(subcol("transactions"),x)}
  toast("SHADOW money refreshed from LIVE.");
}
async function cloneLiveToShadow(pid,ask=true){
  if(ask&&!confirm("Reset this profile's SHADOW world from LIVE? Current shadow changes will be erased."))return;
  toast("Rebuilding shadow…");
  const shadowDocs=[];DATA_COLLECTIONS.forEach(n=>(S.all[n]||[]).forEach(d=>{if((d.profileId||"primary")===pid&&(d.world||"live")==="shadow")shadowDocs.push([n,d.id])}));
  for(const [n,id] of shadowDocs)await deleteDoc(subdoc(n,id));
  const accountMap={},jobMap={};
  const liveAccounts=(S.all.accounts||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="live");
  for(const d of liveAccounts){const r=await addDoc(subcol("accounts"),cloneDataObject(d,pid,"shadow"));accountMap[d.id]=r.id}
  const liveJobs=(S.all.jobs||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="live");
  for(const d of liveJobs){const r=await addDoc(subcol("jobs"),cloneDataObject(d,pid,"shadow"));jobMap[d.id]=r.id}
  for(const n of DATA_COLLECTIONS){
    if(n==="accounts"||n==="jobs")continue;
    const docs=(S.all[n]||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="live");
    for(const d of docs){
      const x=cloneDataObject(d,pid,"shadow");
      if(x.accountId&&accountMap[x.accountId])x.accountId=accountMap[x.accountId];
      if(x.jobId&&jobMap[x.jobId])x.jobId=jobMap[x.jobId];
      await addDoc(subcol(n),x);
    }
  }
  const p=S.profiles.find(x=>x.id===pid);
  if(p)await setDoc(subdoc("profiles",pid),{paperWalletMode:p.paperWalletMode||"mirror"},{merge:true});
  toast("Shadow refreshed from LIVE.");
}

/* WORK & PAY */
function jobName(id){return S.jobs.find(j=>j.id===id)?.name||"Job"}
function entryHours(e){
  if(e.hours!==undefined&&e.hours!==null&&e.status!=="open")return num(e.hours);
  const a=e.startMs||Date.parse(e.startAt||""),b=e.endAt?Date.parse(e.endAt):Date.now();if(!a||!b||b<a)return 0;
  return Math.max(0,(b-a)/3600000-num(e.breakMin)/60);
}
function shiftHours(s){
  if(!s.start||!s.end)return 0;
  const [sh,sm]=s.start.split(":").map(Number),[eh,em]=s.end.split(":").map(Number);let mins=(eh*60+em)-(sh*60+sm);if(mins<0)mins+=1440;
  return Math.max(0,(mins-num(s.breakMin))/60);
}
function weekKey(dateLike){
  const d=new Date(dateLike);if(isNaN(d))return "";
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x.toISOString().slice(0,10);
}
function frequencyDays(f){return f==="weekly"?7:f==="biweekly"?14:f==="semimonthly"?15:30}
function nextPayDate(job){
  if(!job?.nextPayDate)return "";
  let d=new Date(job.nextPayDate+"T12:00:00"),guard=0;const days=frequencyDays(job.payFrequency);
  while(d<new Date(new Date().toDateString())&&guard++<30){if(job.payFrequency==="monthly")d.setMonth(d.getMonth()+1);else d.setDate(d.getDate()+days)}
  return d.toISOString().slice(0,10);
}
function payWindow(job){
  const pay=nextPayDate(job);if(!pay)return {start:"",end:"",payDate:""};
  const payDate=new Date(pay+"T12:00:00"),periodEnd=new Date(payDate),lag=Math.max(0,num(job.payPeriodLagDays||0));
  periodEnd.setDate(periodEnd.getDate()-lag);
  const periodStart=new Date(periodEnd);
  if(job.payFrequency==="monthly")periodStart.setMonth(periodStart.getMonth()-1);
  else periodStart.setDate(periodStart.getDate()-frequencyDays(job.payFrequency));
  return {start:periodStart.toISOString().slice(0,10),end:periodEnd.toISOString().slice(0,10),payDate:pay};
}
function estimatePay(job){
  if(!job)return {hours:0,regular:0,ot:0,gross:0,net:0,scheduled:0};
  const w=payWindow(job),entries=S.timeEntries.filter(e=>e.jobId===job.id&&e.startAt&&(!w.start||String(e.startAt).slice(0,10)>=w.start)&&(!w.end||String(e.startAt).slice(0,10)<w.end));
  const groups={};entries.forEach(e=>{const k=weekKey(e.startAt);groups[k]=(groups[k]||0)+entryHours(e)});
  let regular=0,ot=0;const threshold=num(job.overtimeThreshold||40);
  Object.values(groups).forEach(h=>{regular+=Math.min(h,threshold);ot+=Math.max(0,h-threshold)});
  const rate=num(job.hourlyRate),mult=num(job.overtimeMultiplier||1.5),gross=regular*rate+ot*rate*mult,net=gross*(1-num(job.taxPercent||0)/100);
  const scheduled=S.shifts.filter(s=>s.jobId===job.id&&(!w.start||s.date>=w.start)&&(!w.end||s.date<w.end)).reduce((a,s)=>a+shiftHours(s),0);
  return {hours:regular+ot,regular,ot,gross,net,scheduled,window:w};
}
function activeClock(){return S.timeEntries.find(e=>e.status==="open"&&!e.endAt)}
function thisWeekHours(){const k=weekKey(new Date());return S.timeEntries.filter(e=>weekKey(e.startAt)===k).reduce((a,e)=>a+entryHours(e),0)}

function arrFirst(v){return Array.isArray(v)?v[0]:v}
function normalizeStockQuote(raw,symbol){
  return {symbol:String(arrFirst(raw.symbol)||symbol).toUpperCase(),bid:num(arrFirst(raw.bid)),ask:num(arrFirst(raw.ask)),mid:num(arrFirst(raw.mid)),last:num(arrFirst(raw.last)),change:num(arrFirst(raw.change)),changePct:num(arrFirst(raw.changepct)),volume:num(arrFirst(raw.volume)),updated:arrFirst(raw.updated)||null};
}
function normalizeCandles(raw){
  const t=raw.t||[],o=raw.o||[],h=raw.h||[],l=raw.l||[],cl=raw.c||[],v=raw.v||[];
  return t.map((x,i)=>({t:x,o:num(o[i]),h:num(h[i]),l:num(l[i]),c:num(cl[i]),v:num(v[i])})).slice(-120);
}
function normalizeChain(raw){
  const keys=["optionSymbol","underlying","expiration","strike","side","bid","ask","mid","last","volume","openInterest","iv","delta","gamma","theta","vega","updated"];
  const len=Math.max(0,...keys.map(k=>Array.isArray(raw[k])?raw[k].length:0));
  const out=[];for(let i=0;i<len;i++){const x={};keys.forEach(k=>x[k]=Array.isArray(raw[k])?raw[k][i]:raw[k]);out.push(x)}
  return out.slice(0,80);
}

async function marketFetch(path,params={},saveKind=""){
  const secret=await marketSecret();if(!secret.token)throw new Error("Add your MarketData.app API token in Settings first.");
  const qs=new URLSearchParams(params),url="https://api.marketdata.app"+path+(qs.toString()?"?"+qs.toString():"");
  const res=await fetch(url,{headers:{Accept:"application/json",Authorization:"Bearer "+secret.token}});
  const rate={remaining:res.headers.get("X-Api-Ratelimit-Remaining"),limit:res.headers.get("X-Api-Ratelimit-Limit"),consumed:res.headers.get("X-Api-Ratelimit-Consumed"),reset:res.headers.get("X-Api-Ratelimit-Reset")};S.market.rate=rate;
  let data={};try{data=await res.json()}catch{}
  if(!(res.status===200||res.status===203))throw new Error(data.errmsg||("Market API error "+res.status));
  if(data.s==="error")throw new Error(data.errmsg||"Market API error");
  if(saveKind)await saveMarketSample(saveKind,S.market.symbol,data,{path,params,rate});
  return data;
}
async function fetchMarketQuote(symbol){
  S.market.loading=true;S.market.error="";S.market.symbol=String(symbol||S.market.symbol||"SPY").trim().toUpperCase();render();
  try{
    const raw=await marketFetch("/v1/stocks/quotes/"+encodeURIComponent(S.market.symbol)+"/",{"52week":"true"});
    S.market.quote=normalizeStockQuote(raw,S.market.symbol);
    const from=new Date(Date.now()-45*86400000).toISOString().slice(0,10);
    const candlesRaw=await marketFetch("/v1/stocks/candles/D/"+encodeURIComponent(S.market.symbol)+"/",{from,to:today()});
    S.market.candles=normalizeCandles(candlesRaw);
    S.market.lastFetch=new Date();await saveMarketCache(S.market.symbol,{quote:S.market.quote,candles:S.market.candles,quoteFetchedMs:Date.now(),quoteFetchedIso:new Date().toISOString(),candlesFetchedMs:Date.now()});await saveMarketSample("stock_quote",S.market.symbol,S.market.quote,{rate:S.market.rate});await saveMarketSample("stock_candles",S.market.symbol,S.market.candles,{resolution:"D"});
  }catch(e){S.market.error=e.message||String(e);toast(S.market.error,"error")}finally{S.market.loading=false;render()}
}

  S.market.loading=true;S.market.error="";S.market.symbol=String(symbol||S.market.symbol||"SPY").trim().toUpperCase();render();

}
function marketCandleChart(rows){
  if(!rows?.length)return '<div class="empty">Fetch a ticker to load its stored daily price history.</div>';
  const vals=rows.map(x=>x.c),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,w=720,h=190,p=16;
  const pts=rows.map((x,i)=>((p+i*(w-2*p)/Math.max(1,rows.length-1)).toFixed(1)+","+(h-p-(x.c-min)/span*(h-2*p)).toFixed(1))).join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="3" vector-effect="non-scaling-stroke"/><text x="'+p+'" y="15" fill="currentColor" opacity=".65" font-size="10">'+money(max)+'</text><text x="'+p+'" y="'+(h-3)+'" fill="currentColor" opacity=".65" font-size="10">'+money(min)+'</text></svg>';
}

const STOCK_LESSONS=[
["What a stock actually is","A stock share is a fractional ownership claim on a company. Your return comes from price changes, dividends, or both; the price can move far faster than the underlying business value.","If you buy 5 shares at $100, you control $500 of market value. A move to $110 changes that market value to $550 before fees/taxes."],
["Ticker, exchange, bid and ask","The ticker identifies the security. The bid is the highest displayed buying price and the ask is the lowest displayed selling price; the gap is the spread. Liquid stocks usually have tighter spreads.","A $50.00 bid and $50.03 ask is a $0.03 spread. Crossing the spread with a market order costs part of that immediately."],
["Market, limit and stop orders","A market order prioritizes execution, not price. A limit order sets the worst price you will accept. Stop orders activate after a trigger and can still fill away from the trigger in fast markets.","For a stock asking $25.10, a buy limit at $25.00 may not fill. A market buy likely fills quickly but could be above $25.10."],
["Price vs value","Price is what the market currently agrees on; value is your estimate of what the business is worth. Good analysis separates narrative from measurable earnings, cash flow, debt, growth and competitive position.","A company can report record revenue while the stock falls because the market expected even more."],
["Market capitalization","Market cap equals share price × shares outstanding. It helps compare company size, but it does not tell you whether a stock is cheap or expensive.","A $20 stock with 5 billion shares is a $100B company; a $500 stock with 10 million shares is only $5B."],
["Volume and liquidity","Volume shows how many shares traded. Liquidity is broader: how easily you can enter or exit without moving price. Thin liquidity creates wider spreads and more slippage.","A stock trading 50M shares/day is usually easier to enter than one trading 30k shares/day."],
["Trend, support and resistance","A trend describes the direction of successive highs/lows. Support and resistance are zones where order flow previously changed behavior; they are areas, not magic exact lines.","Higher highs + higher lows suggest an uptrend until that structure breaks."],
["Candles and timeframes","A candle summarizes open, high, low and close for one interval. A 5-minute chart can look bullish while the daily trend is bearish, so timeframe context matters.","Use daily/weekly charts for context and shorter charts for entry timing rather than treating every 1-minute move as a new trend."],
["Volatility and ATR","Volatility measures how much price moves. ATR estimates typical recent range and helps set realistic stops/targets instead of using the same dollar distance on every stock.","A stock with $8 daily ATR needs different risk sizing than a stock with $0.80 ATR."],
["Position sizing","Position size converts an idea into controlled risk. Decide how much you can lose first, then use entry-to-stop distance to calculate shares.","If you accept $20 risk and your stop is $1 below entry, 20 shares risks about $20 before slippage."],
["P/L, drawdown and expectancy","Profit percentage alone is not enough. Track average win, average loss, win rate, maximum drawdown and expectancy. A system can lose more often than it wins and still be profitable.","40% wins averaging +$3 with 60% losses averaging -$1 has positive expectancy: 0.4×3 - 0.6×1 = +0.6 units/trade."],
["Catalysts and risk events","Earnings, guidance, economic data, FDA decisions, litigation and news can cause gaps that ignore normal technical levels. Know scheduled catalysts before holding risk overnight.","A stop at $98 cannot guarantee a $98 exit if earnings make the stock open at $90."]
];
const OPTION_LESSONS=[
["Option contract basics","An option is a contract tied to an underlying security. One standard equity option contract normally represents 100 shares. Calls give the buyer the right to buy; puts give the buyer the right to sell at the strike before/at expiration.","A $2.50 premium normally costs $250 per contract, not $2.50."],
["Calls vs puts","A long call generally benefits from upside; a long put generally benefits from downside. The buyer pays premium and has limited loss to that premium, while some option-selling positions can have much larger risk.","Buying a $100 call for $3 risks $300 per contract if it expires worthless."],
["Strike price","The strike is the contract's exercise price. Relationship between stock price and strike determines whether the option is in, at, or out of the money.","With stock at $105, a $100 call has $5 intrinsic value; a $110 call is out of the money."],
["Expiration and DTE","Options expire. DTE means days to expiration. Less time means less opportunity for the underlying to move, and time value usually decays faster near expiration.","A 2-DTE option can change value violently even when the stock moves only modestly."],
["Intrinsic vs extrinsic value","Intrinsic value is immediate exercise value. Extrinsic value is everything else: time, volatility, rates and demand. Out-of-the-money options have only extrinsic value.","Stock $105, $100 call trading $7: about $5 intrinsic + $2 extrinsic."],
["Break-even at expiration","For a long call, expiration break-even is strike + premium paid. For a long put it is strike - premium paid. Before expiration, option value can differ because extrinsic value remains.","Buy $100 call for $3: expiration break-even is $103."],
["Delta","Delta approximates option-price sensitivity to a $1 underlying move and is also often used as a rough probability-like measure of finishing ITM, though it is not a literal probability guarantee.","A call with 0.55 delta may gain roughly $0.55 for a $1 stock rise, all else equal."],
["Gamma","Gamma measures how fast delta changes as the stock moves. Short-dated at-the-money options can have high gamma, making exposure change rapidly.","A 0.50-delta call can become much more stock-like after a fast upward move."],
["Theta","Theta estimates time decay. Long-option buyers generally lose extrinsic value as time passes if other factors stay unchanged; sellers benefit from that decay but take other risks.","A theta of -0.08 means about $8/day per contract in theoretical decay, not a guaranteed straight line."],
["Vega and implied volatility","Vega measures sensitivity to implied volatility (IV). IV reflects the market's priced expectation of future movement, not direction. High IV can make options expensive.","A correct directional call can still lose if IV collapses after earnings."],
["IV crush and earnings","Before major events, option premiums often rise because IV rises. After the event, uncertainty disappears and IV can collapse, reducing premiums immediately.","A call may lose value after a small post-earnings rise if the IV drop is larger than the directional gain."],
["Bid/ask and option liquidity","Options can have very wide spreads. Use limit orders and inspect volume/open interest. A theoretical profit is meaningless if you cannot exit near the displayed midpoint.","$1.00 bid / $1.40 ask is a 40-cent spread, or $40 per contract."],
["Long calls and puts as defined risk","Long premium positions have a known maximum loss: premium paid. That makes them useful for learning position sizing, but repeated premium decay can still drain an account.","Five $100-premium contracts risk $500, even if each looks 'cheap'."],
["Vertical spreads","A vertical combines options of the same type/expiration at different strikes. It can reduce cost and cap both profit and loss. Spreads also reduce some IV/theta exposure compared with naked long premium.","Buy $100 call and sell $105 call: upside is capped above $105, but entry cost is lower than the long call alone."],
["Assignment, exercise and expiration risk","ITM options may be exercised or assigned. Short options can create stock positions. Brokers may close positions near expiration if the account cannot support exercise.","Do not hold a contract into expiration unless you understand what 100-share exercise/assignment would do to the account."]
];
const RISK_LESSONS=[
["Risk first, trade second","Decide maximum acceptable loss before looking at possible profit. The same setup can be sensible at small size and reckless at large size.","If losing $50 damages your week, do not take a position that can lose $300."],
["Risk per trade","Use a fixed dollar or small account percentage cap so one bad idea cannot dominate your results.","A $1,000 paper account risking 1% uses about $10 risk per trade."],
["Daily loss limit","A daily stop prevents emotional escalation after losses. Once hit, stop placing new trades and review instead.","Three -$10 losses might trigger a -$30 daily limit."],
["Correlation","Ten positions can still be one bet if they move together. Tech stocks, semiconductors and QQQ can all concentrate the same risk.","Owning NVDA, AMD, AVGO and SMH is more concentrated than four unrelated positions."],
["Gap risk","Overnight and event gaps can jump past stops. Reduce size or avoid holding through binary events when the gap would be unacceptable.","A stop cannot fill at $50 if the next available trade is $44."],
["Liquidity risk","Small size does not remove liquidity risk. Wide spreads and low volume can create large percentage losses immediately.","A $0.20 spread on a $0.60 option is enormous friction."],
["Leverage","Options create leverage because small premium controls 100-share exposure. Leverage magnifies mistakes as well as correct calls.","Ten contracts can represent exposure tied to 1,000 shares."],
["Do not average blindly","Adding to a losing position changes the risk. Only add if it was planned in advance with a total maximum loss.","'It's cheaper now' is not a risk plan."],
["Review process, not one outcome","A good trade can lose and a bad trade can win. Evaluate whether entry, sizing, reason and exit followed the plan.","One lucky win should not validate a strategy."],
["Paper-to-live transition","Paper trading tests process, but fills and emotions differ live. Require enough samples and stable rules before increasing real risk.","Move from simulation to tiny live size only after consistent logged execution."]
];

function stockConceptGraph(){
  const vals=[100,103,99,106,111,108,117,113,122],w=600,h=180,p=18,min=Math.min(...vals),max=Math.max(...vals),span=max-min;
  const pts=vals.map((v,i)=>(p+i*(w-2*p)/(vals.length-1))+","+(h-p-(v-min)/span*(h-2*p))).join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="3" vector-effect="non-scaling-stroke"/><line x1="'+p+'" y1="'+(h-p)+'" x2="'+(w-p)+'" y2="'+(h-p)+'" stroke="currentColor" opacity=".15"/><text x="20" y="20" fill="currentColor" opacity=".65" font-size="11">Price is a path, not a straight line</text></svg>';
}
function optionPayoffGraph(type="call",strike=100,premium=5){
  const w=600,h=180,p=18,minX=70,maxX=130,vals=[];
  for(let s=minX;s<=maxX;s+=2){const intrinsic=type==="call"?Math.max(0,s-strike):Math.max(0,strike-s);vals.push({s,p:(intrinsic-premium)*100})}
  const ys=vals.map(x=>x.p),minY=Math.min(...ys),maxY=Math.max(...ys),span=maxY-minY||1;
  const pts=vals.map((x,i)=>(p+i*(w-2*p)/(vals.length-1))+","+(h-p-(x.p-minY)/span*(h-2*p))).join(" ");
  const zeroY=h-p-(0-minY)/span*(h-2*p);
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line x1="'+p+'" y1="'+zeroY+'" x2="'+(w-p)+'" y2="'+zeroY+'" stroke="currentColor" opacity=".2"/><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="3" vector-effect="non-scaling-stroke"/><text x="20" y="20" fill="currentColor" opacity=".65" font-size="11">'+type.toUpperCase()+' expiration P/L · strike $'+strike+' · premium $'+premium+'</text></svg>';
}

function updatePracticeMath(){
  const a=$("#practiceShares"),b=$("#practiceMove"),out=$("#practiceStockResult");if(!a||!b||!out)return;

function paperKey(t){
  const s=String(t.symbol||"").toUpperCase();

}
function tradeMultiplier(t){return (t.instrument||"stock")==="option"?100:1}

  const positions={};let cash=paperStartingCash();
  [...S.paperTrades].sort((a,b)=>String(a.dateTime||a.date||"").localeCompare(String(b.dateTime||b.date||""))).forEach(t=>{
    const key=paperKey(t),q=num(t.qty),p=num(t.price),m=tradeMultiplier(t);if(!t.symbol)return;

    const pos=positions[key];pos.lastPrice=p;
    if(t.side==="buy"){cash-=q*p*m;pos.qty+=q;pos.cost+=q*p*m}
    if(t.side==="sell"){cash+=q*p*m;const oldQty=Math.max(pos.qty,.0000001),avgUnit=(pos.cost/oldQty)/m;pos.qty-=q;pos.cost=Math.max(0,pos.cost-avgUnit*q*m)}
  });

function coachNudgeCandidates(){
  const out=[],target=num(S.profile.weeklyIncomeTarget||100),gigEarn=weeklyGigIncome(),gap=Math.max(0,target-gigEarn),p=plan(),flow=monthFlow();
  if(S.profile.coachNotifyTasks!==false){
    const urgent=p.selected.filter(x=>x.must||daysUntil(x.due)<=1).slice(0,2);
    urgent.forEach(x=>out.push({score:120+num(x.score),title:"Pier · do this next",body:x.title+(x.reason?" · "+x.reason:""),view:"day",kind:"task"}));
    const pending=S.dailyDrafts.filter(x=>x.date===today()&&x.status==="pending").length;
    if(pending)out.push({score:88,title:"Pier · your day is waiting",body:pending+" GOAP block"+(pending===1?"":"s")+" need approval/correction.",view:"day",kind:"task"});
  }
  if(S.profile.coachNotifyGigs!==false&&gap>0){
    const active=S.gigPlans.find(x=>x.status==="active"),g=active?S.gigCatalog.find(x=>x.id===active.gigId):topGigRecommendations(1)[0];
    if(g)out.push({score:110,title:"Pier · "+money(gap)+" weekly money gap",body:(active?"Continue ":"Try ")+g.title+". Log the result so I learn what actually pays.",view:"gigs",kind:"gig"});
    else out.push({score:78,title:"Pier · weekly money target",body:money(gap)+" still needed. Open Gigs and finish your setup.",view:"gigs",kind:"gig"});
  }
  if(S.profile.coachNotifyMoney!==false){
    const due=S.bills.filter(b=>b.status!=="paid"&&b.dueDate&&daysUntil(b.dueDate)>=0&&daysUntil(b.dueDate)<=3).sort((a,b)=>daysUntil(a.dueDate)-daysUntil(b.dueDate))[0];
    if(due)out.push({score:105,title:"Pier · bill coming up",body:(due.name||"Bill")+" · "+money(due.amount)+" · due "+fmtDate(due.dueDate),view:"coach",kind:"money"});
    if(flow.income-flow.expense<0)out.push({score:72,title:"Pier · spending check",body:"This month is "+money(flow.income-flow.expense)+" net. Open Savings to see where it is going.",view:"savings",kind:"money"});
    const smoke=smokeSpendMonth();if(smoke>=50)out.push({score:64,title:"Pier · smoking spend",body:money(smoke)+" tracked this month. Open Savings/Smoke Tracker if you want to keep reducing it.",view:"smoking",kind:"money"});
  }
  if(S.profile.coachNotifyRelationship!==false){
    const person=relationshipPerson(),attention=relationshipAttention(person?.id||"");
    if(attention>=70)out.push({score:60+attention/3,title:"Pier · relationship check",body:(person?.name||"Your partner")+" attention pressure is "+attention+"/100. Plan something small if today allows it.",view:"relationship",kind:"relationship"});
  }
  return out.sort((a,b)=>b.score-a.score);
}

async function callConfiguredAssistant(prompt){

    if(!window.PierLocalAI?.generate)return null;
    const out=await window.PierLocalAI.generate(request);return out?.message||out?.text||String(out||"");
  }

  const headers={"Content-Type":"application/json"};if(S.profile.aiSendFirebaseToken!==false)headers.Authorization="Bearer "+await S.user.getIdToken();
  let body=request;
  if((S.profile.aiProtocol||"pier")==="openai_compatible"){
    body={model:S.profile.aiModel||"local-model",messages:[{role:"system",content:"You are Pier, a concise personal planning assistant. Use only the supplied Pier context when provided. Focus on executable next steps and never invent account facts."},{role:"user",content:JSON.stringify({prompt,context:buildAiDataPack()})}],max_tokens:300};

  if((S.profile.aiProtocol||"pier")==="openai_compatible")return out?.choices?.[0]?.message?.content||out?.choices?.[0]?.text||"";
  return out?.message||out?.text||"";
}

function initBuddyMotion(){
  if(initBuddyMotion.done)return;initBuddyMotion.done=true;
  let raf=0,lastX=innerWidth/2,lastY=innerHeight/2;
  const aim=(x,y)=>{lastX=x;lastY=y;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const b=$("#pierBuddy");if(!b)return;const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=x-cx,dy=y-cy,len=Math.max(1,Math.hypot(dx,dy)),ex=clamp(dx/len*3.2,-3.2,3.2),ey=clamp(dy/len*2.3,-2.3,2.3);b.style.setProperty("--eye-x",ex+"px");b.style.setProperty("--eye-y",ey+"px")})};
  document.addEventListener("pointermove",e=>aim(e.clientX,e.clientY),{passive:true});document.addEventListener("pointerdown",e=>aim(e.clientX,e.clientY),{passive:true});
  const blink=()=>{const b=$("#pierBuddy");if(b){b.classList.add("blink");setTimeout(()=>b.classList.remove("blink"),140)}setTimeout(blink,2400+Math.random()*4200)};setTimeout(blink,1800);
}
