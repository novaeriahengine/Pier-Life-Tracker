    '<form><div class="field"><label>Name</label><input name="name" required value="'+esc(b.name||"")+'" placeholder="Rent, phone, school, insurance…"></div><div class="modal-grid"><div class="field"><label>Amount due</label><input name="amount" type="number" min="0" step=".01" required value="'+num(b.amount||0)+'"></div><div class="field"><label>Minimum acceptable payment</label><input name="minimumDue" type="number" min="0" step=".01" value="'+num(b.minimumDue||0)+'" placeholder="Leave 0 to use full amount"></div><div class="field"><label>Due date</label><input name="dueDate" type="date" required value="'+esc(b.dueDate||today())+'"></div><div class="field"><label>Category</label><select name="billCategory"><option value="housing">Housing / rent</option><option value="utilities">Utilities</option><option value="childcare">Childcare / school</option><option value="transport">Transportation / car</option><option value="insurance">Insurance</option><option value="medical">Medical</option><option value="legal">Legal / DMV / court</option><option value="food">Food / essentials</option><option value="debt">Debt / credit</option><option value="subscription">Subscription</option><option value="other">Other</option></select></div><div class="field"><label>If unpaid</label><select name="consequence"><option value="critical">Critical: housing, shutoff, job/family risk</option><option value="high">High consequence</option><option value="normal">Normal</option><option value="low">Low consequence</option></select></div><div class="field"><label>Late fee</label><input name="lateFee" type="number" min="0" step=".01" value="'+num(b.lateFee||0)+'"></div><div class="field"><label>Recurrence</label><select name="recurrence"><option value="none">One time</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="monthly">Monthly</option></select></div><div class="field"><label>Priority</label><select name="priority">'+[1,2,3,4,5].map(x=>'<option value="'+x+'" '+(num(b.priority||5)===x?'selected':'')+'>P'+x+'</option>').join("")+'</select></div></div><div class="field"><label>Why this matters / notes</label><input name="consequenceNote" value="'+esc(b.consequenceNote||"")+'" placeholder="Landlord deadline, service shutoff, needed for work…"></div><label class="check"><input name="partialAllowed" type="checkbox" '+(b.partialAllowed?'checked':'')+'> Partial payment can help</label><div class="modal-foot">'+(isEdit?'<button class="btn danger" type="button" id="deleteBillBtn">Delete</button>':'')+'<button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>',
    async fd=>{const data={name:fd.get("name").trim(),amount:num(fd.get("amount")),minimumDue:num(fd.get("minimumDue")),dueDate:fd.get("dueDate"),billCategory:fd.get("billCategory"),consequence:fd.get("consequence"),lateFee:num(fd.get("lateFee")),partialAllowed:fd.get("partialAllowed")==="on",consequenceNote:fd.get("consequenceNote").trim(),recurrence:fd.get("recurrence"),priority:num(fd.get("priority")),status:"open",updatedAt:serverTimestamp()};if(isEdit)await updateDoc(subdoc("bills",b.id),data);else await addDoc(subcol("bills"),{...data,...ctxFields(),createdAt:serverTimestamp()});toast("Bill saved.")});
  $("#cancelModalBtn").onclick=closeModal;$("#modalBody select[name=recurrence]").value=b.recurrence||"none";$("#modalBody select[name=billCategory]").value=b.billCategory||"other";$("#modalBody select[name=consequence]").value=b.consequence||"normal";
  if(isEdit)$("#deleteBillBtn").onclick=async()=>{if(confirm("Delete this bill?")){await deleteDoc(subdoc("bills",b.id));closeModal()}};
}
function addPeriod(dateStr,recurrence){
  const d=new Date(dateStr+"T12:00:00");if(recurrence==="weekly")d.setDate(d.getDate()+7);if(recurrence==="biweekly")d.setDate(d.getDate()+14);if(recurrence==="monthly")d.setMonth(d.getMonth()+1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
async function payBill(id){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  if(!S.accounts.length)return toast("Add an account before paying a bill.","error");
  const opts=S.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+' · '+money(balances()[a.id]||0)+'</option>').join("");
  showModal("Pay "+b.name,'<form><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" value="'+num(b.amount)+'"></div><div class="field"><label>Pay from</label><select name="accountId">'+opts+'</select></div><div class="field"><label>Payment date</label><input name="date" type="date" value="'+today()+'"></div><div class="modal-foot"><button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Record payment</button></div></form>',
    async fd=>{
      const batch=writeBatch(db),txRef=doc(subcol("transactions"));
      batch.set(txRef,{type:"expense",amount:num(fd.get("amount")),accountId:fd.get("accountId"),date:fd.get("date"),description:b.name,category:b.billCategory||"Bills",...ctxFields(),createdAt:serverTimestamp()});
      if(b.recurrence&&b.recurrence!=="none")batch.update(subdoc("bills",id),{dueDate:addPeriod(b.dueDate,b.recurrence),lastPaidDate:fd.get("date"),status:"open",updatedAt:serverTimestamp()});
      else batch.update(subdoc("bills",id),{status:"paid",lastPaidDate:fd.get("date"),updatedAt:serverTimestamp()});
      await batch.commit();
      if(b.relatedLegalImportKey){
        const legal=S.legalObligations.find(x=>x.importKey===b.relatedLegalImportKey);
        if(legal){const paid=num(fd.get("amount")),left=Math.max(0,num(legal.amountRemaining)-paid);await updateDoc(subdoc("legalObligations",legal.id),{amountRemaining:left,status:left<=0?"resolved":"payment_plan",updatedAt:serverTimestamp()})}
      }
      toast("Payment recorded.");
    });
  $("#cancelModalBtn").onclick=closeModal;
}

    async fd=>{const data={name:fd.get("name").trim(),kind:fd.get("kind"),priority:num(fd.get("priority")),current:num(fd.get("current")),target:num(fd.get("target")),deadline:fd.get("deadline"),nextAction:fd.get("nextAction").trim(),nextActionMinutes:num(fd.get("nextActionMinutes")),plannerEnabled:fd.get("plannerEnabled")==="on",status:"open",updatedAt:serverTimestamp()};if(isEdit)await updateDoc(subdoc("goals",g.id),data);else await addDoc(subcol("goals"),{...data,...ctxFields(),createdAt:serverTimestamp()});toast("Goal saved.")});
  $("#cancelModalBtn").onclick=closeModal;$("#modalBody select[name=kind]").value=g.kind||"money";
  if(isEdit)$("#deleteGoalBtn").onclick=async()=>{if(confirm("Delete this goal?")){await deleteDoc(subdoc("goals",g.id));closeModal()}};
}
function openGoalProgress(g){
  showModal("Update "+g.name,'<form><div class="field"><label>Current progress</label><input name="current" type="number" step=".01" value="'+num(g.current)+'"></div><div class="field"><label>Next action</label><input name="nextAction" value="'+esc(g.nextAction||"")+'"></div><div class="modal-foot"><button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Update</button></div></form>',
    async fd=>{const cur=num(fd.get("current"));await updateDoc(subdoc("goals",g.id),{current:cur,nextAction:fd.get("nextAction").trim(),status:cur>=num(g.target)?"done":"open",updatedAt:serverTimestamp()});toast("Goal updated.")});
  $("#cancelModalBtn").onclick=closeModal;
}

function openRoutineModal(r={}){
  const isEdit=!!r.id,days=Array.isArray(r.days)?r.days.map(Number):[0,1,2,3,4,5,6];
  const checks=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d,i)=>'<label class="pill"><input style="width:auto" type="checkbox" name="day" value="'+i+'" '+(days.includes(i)?'checked':'')+'> '+d+'</label>').join("");
  showModal(isEdit?"Edit routine":"Add routine",
    '<form><div class="field"><label>Routine</label><input name="name" required value="'+esc(r.name||"")+'" placeholder="Laundry reset, gym, clean room…"></div><div class="field"><label>Days</label><div style="display:flex;gap:6px;flex-wrap:wrap">'+checks+'</div></div><div class="modal-grid"><div class="field"><label>Minutes</label><input name="estimateMin" type="number" min="1" value="'+num(r.estimateMin||20)+'"></div><div class="field"><label>Preferred time</label><input name="preferredTime" type="time" value="'+esc(r.preferredTime||"")+'"></div><div class="field"><label>Priority</label><select name="priority">'+[1,2,3,4,5].map(x=>'<option value="'+x+'" '+(num(r.priority||3)===x?'selected':'')+'>P'+x+'</option>').join("")+'</select></div></div><label class="check"><input name="must" type="checkbox" '+(r.must?'checked':'')+'> HAVE TO when scheduled</label><label class="check"><input name="canOverlap" type="checkbox" '+(r.canOverlap?'checked':'')+'> Can overlap another family/household block</label><label class="check"><input name="active" type="checkbox" '+(r.active!==false?'checked':'')+'> Active</label><div class="modal-foot">'+(isEdit?'<button class="btn danger" type="button" id="deleteRoutineBtn">Delete</button>':'')+'<button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>',
    async fd=>{const data={name:fd.get("name").trim(),days:fd.getAll("day").map(Number),estimateMin:num(fd.get("estimateMin")),preferredTime:fd.get("preferredTime")||"",priority:num(fd.get("priority")),must:fd.get("must")==="on",canOverlap:fd.get("canOverlap")==="on",active:fd.get("active")==="on",updatedAt:serverTimestamp()};if(isEdit)await updateDoc(subdoc("routines",r.id),data);else await addDoc(subcol("routines"),{...data,...ctxFields(),lastCompletedDate:"",createdAt:serverTimestamp()});toast("Routine saved.")});
  $("#cancelModalBtn").onclick=closeModal;if(isEdit)$("#deleteRoutineBtn").onclick=async()=>{if(confirm("Delete routine?")){await deleteDoc(subdoc("routines",r.id));closeModal()}};

async function saveInbox(e){
  e.preventDefault();const input=e.currentTarget.elements.text,text=input.value.trim();if(!text)return;
  await addDoc(subcol("inbox"),{text,converted:false,date:today(),createdMs:Date.now(),...ctxFields(),createdAt:serverTimestamp()});input.value="";toast("Captured.");
}
function inboxToTask(id){
  const item=S.inbox.find(x=>x.id===id);if(!item)return;
  openTaskModal({title:item.text,category:"Inbox",priority:3,estimateMin:30,_inboxId:id});
  const form=$("#modalBody form"),old=form?.onsubmit;
  // Conversion is marked after Firestore receives the task through the normal submit handler.
  const observer=new MutationObserver(()=>{});observer.disconnect();
  updateDoc(subdoc("inbox",id),{converted:true,convertedAt:serverTimestamp()}).catch(()=>{});

async function saveSettings(e){
  e.preventDefault();const fd=new FormData(e.currentTarget);
  await setDoc(userDoc(),{name:fd.get("name").trim()||"Pier",dailyMinutes:num(fd.get("dailyMinutes")),emergencyReserve:num(fd.get("emergencyReserve")),urgentDays:num(fd.get("urgentDays")),marketAutoDailyLimit:num(fd.get("marketAutoDailyLimit"))||90,licenseStatus:fd.get("licenseStatus")||"active",theme:fd.get("theme")},{merge:true});
  toast("Planner settings saved.");
}
function exportData(){
  const payload={exportedAt:new Date().toISOString(),account:S.profile,profiles:S.profiles,activeProfileId:S.activeProfileId,worldMode:S.worldMode,data:S.all};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="pier-life-backup-"+today()+".json";a.click();URL.revokeObjectURL(url);toast("Backup exported.");
}
async function requestNotifications(){
  if(!("Notification" in window))return toast("This browser does not support notifications.","error");
  const p=await Notification.requestPermission();toast(p==="granted"?"Chrome/PWA notifications enabled.":"Notification permission was not granted.",p==="granted"?"ok":"error");
  if(p==="granted")sendTestNotification();
}
async function checkNotifications(){
  if(S.profile.coachNotifications===false||!S.user)return;
  const mode=S.profile.coachNotifyMode||"persistent",base=Math.max(15,num(S.profile.coachNotifyMinutes||60)),minutes=mode==="persistent"?Math.min(base,60):mode==="quiet"?Math.max(base,240):base;
  const last=num(localStorage.getItem("pier-last-coach-notify")||0);if(Date.now()-last<minutes*60000)return;
  const choices=coachNudgeCandidates();if(!choices.length)return;
  const index=num(localStorage.getItem("pier-nudge-index")||0)%Math.min(choices.length,4),n=choices[index];
  localStorage.setItem("pier-nudge-index",String(index+1));localStorage.setItem("pier-last-coach-notify",String(Date.now()));
  showBuddyBubble(n.body,12000);
  if(Notification?.permission==="granted")await showPierNotification(n.title,n.body,{tag:"pier-"+n.kind,view:n.view});
  await addDoc(subcol("coachEvents"),{kind:"coach_nudge",title:n.title,body:n.body,targetView:n.view,score:n.score,createdAtIso:new Date().toISOString(),...ctxFields(),createdAt:serverTimestamp()}).catch(()=>{});
}
setInterval(checkNotifications,5*60*1000);
setTimeout(checkNotifications,15000);
setInterval(autoRefreshWatchlist,60*1000);
setInterval(()=>{if(S.view==="sessions"&&activeSession())render()},30*1000);
setInterval(()=>{if(["dashboard","mylife","day"].includes(S.view))render()},60*1000);

document.addEventListener("visibilitychange",async()=>{
  if(!document.hidden)return;
  const f=activeFocus();if(!f)return;
  try{await updateDoc(subdoc("focusSessions",f.id),{interruptions:num(f.interruptions)+1,updatedAt:serverTimestamp()})}catch{}
});
setInterval(async()=>{
  const f=activeFocus();if(!f)return;
  const elapsed=(Date.now()-num(f.startMs))/60000;
  if(elapsed>=num(f.plannedMin)&&!f.notified){
    try{await updateDoc(subdoc("focusSessions",f.id),{notified:true,updatedAt:serverTimestamp()})}catch{}
    if("Notification" in window&&Notification.permission==="granted")new Notification("Pier focus block complete",{body:(f.label||"Focus")+" · "+Math.round(elapsed)+" minutes"});
    else toast("Focus block complete: "+(f.label||"Focus"));
  }
  if(S.view==="day")render();
},60000);

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("service worker",e)));
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data?.type==="PIER_NAVIGATE"&&e.data.view)navigate(e.data.view)});
}
