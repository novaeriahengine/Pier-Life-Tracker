<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08131f">
<title>Pier Life Tracker</title>
<meta name="description" content="A deterministic personal life planner powered by GOAP-style rules, not an LLM.">
<style>
:root{
  --bg:#07111b;--bg2:#0b1723;--panel:#101e2c;--panel2:#142536;--panel3:#1a2d40;
  --text:#f3f8fc;--muted:#8fa5b8;--line:#24384a;--accent:#4fd1a5;--accent2:#65b7ff;
  --danger:#ff6b6b;--warn:#ffca63;--ok:#4fd1a5;--shadow:0 18px 50px rgba(0,0,0,.28);
  --radius:18px;--sidebar:245px;--top:70px;
}
[data-theme="light"]{
  --bg:#eef4f8;--bg2:#f6fafc;--panel:#ffffff;--panel2:#f5f9fb;--panel3:#edf4f8;
  --text:#102131;--muted:#667b8f;--line:#d7e2ea;--shadow:0 12px 32px rgba(36,67,91,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
strong{font-weight:750}
#authScreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:
 radial-gradient(circle at 15% 15%,rgba(79,209,165,.12),transparent 35%),
 radial-gradient(circle at 85% 10%,rgba(101,183,255,.12),transparent 32%),var(--bg)}
.auth-card{width:min(440px,100%);background:rgba(16,30,44,.92);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:-.03em;font-size:22px}
.logo-mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#06131d;font-weight:950;box-shadow:0 8px 24px rgba(79,209,165,.22)}
.auth-card h1{font-size:34px;line-height:1.05;margin:30px 0 8px;letter-spacing:-.04em}
.auth-card p{color:var(--muted);line-height:1.55;margin:0 0 24px}
.field{display:grid;gap:7px;margin:13px 0}
.field label{font-size:12px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px 13px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(101,183,255,.12)}
textarea{min-height:92px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:hover{transform:translateY(-1px);border-color:#3c5367}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#062017}
.btn.blue{background:var(--accent2);border-color:var(--accent2);color:#07131e}
.btn.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.35);color:#ff8c8c}
.btn.warn{background:rgba(255,202,99,.12);border-color:rgba(255,202,99,.35);color:var(--warn)}
.btn.ghost{background:transparent}
.btn.icon{width:38px;height:38px;padding:0}
.btn.wide{width:100%}
.auth-actions{display:flex;gap:10px;margin-top:18px}
.auth-actions .btn{flex:1}
.auth-links{display:flex;justify-content:space-between;gap:12px;margin-top:15px;font-size:12px}
.link-btn{border:0;background:none;color:var(--accent2);padding:0}
#appShell{min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);padding:18px 14px;border-right:1px solid var(--line);background:var(--bg2);z-index:20;display:flex;flex-direction:column}
.sidebar .logo{padding:4px 8px 18px}
.nav{display:grid;gap:5px;margin-top:10px}
.nav-btn{width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;display:flex;align-items:center;gap:11px;font-weight:700}
.nav-btn:hover{background:var(--panel);color:var(--text)}
.nav-btn.active{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav-icon{width:22px;text-align:center}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.sync-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.sync-row{display:flex;align-items:center;gap:8px;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(79,209,165,.1)}
.dot.bad{background:var(--danger)}
.main{margin-left:var(--sidebar);min-height:100vh}
.topbar{height:var(--top);position:sticky;top:0;z-index:15;background:rgba(7,17,27,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
[data-theme="light"] .topbar{background:rgba(238,244,248,.86)}
.topbar h2{font-size:19px;margin:0;letter-spacing:-.02em}
.topbar .spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 9px 6px 7px;max-width:220px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#07131e;display:grid;place-items:center;font-weight:900}
.user-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--muted)}
.content{padding:24px;max-width:1500px;margin:0 auto}
.setup-banner{background:rgba(255,202,99,.1);border:1px solid rgba(255,202,99,.32);color:#ffe1a0;border-radius:15px;padding:12px 14px;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
[data-theme="light"] .setup-banner{color:#775200}
.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 26px rgba(0,0,0,.08)}
.card.pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h3{margin:0;font-size:15px;letter-spacing:-.01em}
.hero-card{padding:24px;min-height:210px;background:
 linear-gradient(135deg,rgba(79,209,165,.10),transparent 45%),
 linear-gradient(315deg,rgba(101,183,255,.08),transparent 45%),var(--panel)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:850}
.hero-title{font-size:31px;line-height:1.08;margin:10px 0 8px;letter-spacing:-.04em}
.hero-sub{color:var(--muted);max-width:720px;line-height:1.5}
.next-action{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rank-bubble{min-width:46px;height:46px;border-radius:14px;background:var(--panel3);display:grid;place-items:center;font-weight:900}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.metric .value{font-size:24px;font-weight:850;margin-top:7px;letter-spacing:-.03em}
.metric .sub{font-size:11px;color:var(--muted);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plan-list,.stack{display:grid;gap:9px}
.plan-item,.task-row,.bill-row,.routine-row,.inbox-row{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.plan-num{width:30px;height:30px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}
.plan-body,.row-main{min-width:0;flex:1}
.plan-title,.task-title{font-weight:800;line-height:1.25}
.plan-reason,.row-meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:1px solid var(--line);padding:4px 8px;font-size:10px;font-weight:800;color:var(--muted);background:var(--panel)}
.pill.must{color:#ffd6d6;border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08)}
.pill.urgent{color:#ffe3aa;border-color:rgba(255,202,99,.35);background:rgba(255,202,99,.08)}
.pill.good{color:#bff6e3;border-color:rgba(79,209,165,.35);background:rgba(79,209,165,.08)}
.pill.blue{color:#c8e7ff;border-color:rgba(101,183,255,.35);background:rgba(101,183,255,.08)}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 16px}
.section-title h1{font-size:30px;margin:0;letter-spacing:-.04em}
.section-title p{margin:5px 0 0;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.task-board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.board-col{min-width:0}
.board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.board-head h3{margin:0;font-size:13px}
.count{min-width:25px;height:25px;padding:0 7px;border-radius:99px;background:var(--panel2);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.money-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.account-card{padding:16px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.account-card .amount{font-size:25px;font-weight:900;margin:8px 0}
.account-card .name{font-size:12px;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;background:var(--panel2)}
tr:last-child td{border-bottom:0}
.amount.income{color:var(--ok)}
.amount.expense{color:#ff9b9b}
.progress{height:8px;border-radius:999px;background:var(--panel3);overflow:hidden}
.progress>span{height:100%;display:block;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}
.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.goal-card{padding:17px}
.goal-top{display:flex;justify-content:space-between;gap:10px}
.goal-title{font-weight:850}
.goal-value{font-size:24px;font-weight:900;margin:16px 0 8px}
.goal-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-top:8px}
.empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px}
.quick-capture{display:flex;gap:8px}
.quick-capture input{flex:1}
.blocker{border-color:rgba(255,107,107,.38);background:rgba(255,107,107,.06)}
.priority-bar{width:5px;align-self:stretch;border-radius:9px;background:var(--muted)}
.priority-bar.p5{background:var(--danger)}.priority-bar.p4{background:var(--warn)}.priority-bar.p3{background:var(--accent2)}.priority-bar.p2{background:var(--accent)}.priority-bar.p1{background:var(--muted)}
.tabs{display:flex;gap:5px;background:var(--panel2);border:1px solid var(--line);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow:auto}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap}
.tab.active{background:var(--panel);color:var(--text)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.setting-row{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-row input,.setting-row select{width:160px}
.modal-backdrop{position:fixed;inset:0;background:rgba(1,8,14,.72);backdrop-filter:blur(7px);z-index:100;display:grid;place-items:center;padding:18px}
.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.modal-head{position:sticky;top:0;background:var(--panel);padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
.modal-head h3{margin:0}
.modal-body{padding:20px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;gap:9px;align-items:center;margin:12px 0;color:var(--text)}
.check input{width:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:9px;width:min(360px,calc(100% - 36px))}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);animation:toastin .18s ease-out}
.toast.error{border-color:rgba(255,107,107,.45)}.toast.ok{border-color:rgba(79,209,165,.45)}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mobile-nav{display:none}
.kbd{border:1px solid var(--line);background:var(--panel2);padding:2px 6px;border-radius:6px;font-size:10px;color:var(--muted)}
.split-line{height:1px;background:var(--line);margin:15px 0}
.right{text-align:right}
@media(max-width:1100px){
  .hero,.grid-2,.settings-grid{grid-template-columns:1fr}
  .task-board{grid-template-columns:1fr}
  .goal-grid,.account-grid{grid-template-columns:repeat(2,1fr)}
  .money-hero{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  :root{--sidebar:0px}
  .sidebar{display:none}
  .main{margin-left:0;padding-bottom:72px}
  .topbar{padding:0 14px}
  .content{padding:15px}
  .topbar .btn .desktop-label{display:none}
  .user-chip span{display:none}
  .mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;height:64px;background:rgba(11,23,35,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:800;display:grid;place-items:center;gap:2px}
  .mobile-nav button span{font-size:19px;line-height:1}
  .mobile-nav button.active{color:var(--accent)}
}
@media(max-width:600px){
  .hero-card{padding:19px}.hero-title{font-size:26px}
  .metrics{grid-template-columns:1fr 1fr}
  .goal-grid,.account-grid{grid-template-columns:1fr}
  .money-hero{grid-template-columns:1fr 1fr}
  .modal-grid{grid-template-columns:1fr}
  .section-title{align-items:flex-start;flex-direction:column}
  .toolbar{width:100%}.toolbar input,.toolbar select{width:100%}
}

/* Pier v2: household profiles, shadow worlds, work/pay, family life and paper markets */
.sidebar{overflow-y:auto}
.context-switcher{display:flex;align-items:center;gap:6px;margin-left:10px}
.context-switcher select{width:auto;max-width:160px;padding:8px 10px;border-radius:10px;font-size:11px;font-weight:800}
.context-switcher .world-shadow{border-color:rgba(170,120,255,.55);background:rgba(155,105,255,.14);color:#d9c4ff}
.shadow-strip{margin-bottom:16px;border:1px solid rgba(166,114,255,.45);background:linear-gradient(90deg,rgba(139,92,246,.14),rgba(101,183,255,.08));border-radius:14px;padding:11px 13px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.shadow-strip strong{color:#d9c4ff}
.context-badge{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:10px;font-weight:850}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.profile-card{padding:17px;position:relative;overflow:hidden}
.profile-card.active{border-color:rgba(79,209,165,.55);box-shadow:inset 0 0 0 1px rgba(79,209,165,.14)}
.profile-orb{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#07131e;font-weight:950;font-size:18px}
.work-clock{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(135deg,rgba(79,209,165,.08),rgba(101,183,255,.06)),var(--panel2)}
.clock-time{font-size:31px;font-weight:900;letter-spacing:-.04em}
.life-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.market-up{color:var(--ok)}.market-down{color:#ff8f8f}
.paper-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.schedule-row{border-left:3px solid var(--accent2)}
.person-chip{display:flex;gap:10px;align-items:center}
.person-dot{width:34px;height:34px;border-radius:12px;background:var(--panel3);display:grid;place-items:center;font-weight:900}
.inline-stat{display:flex;gap:5px;align-items:baseline}.inline-stat b{font-size:20px}
@media(max-width:1100px){.profile-grid{grid-template-columns:repeat(2,1fr)}.life-grid{grid-template-columns:1fr}.paper-hero{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.context-switcher{margin-left:0;flex:1}.context-switcher select{max-width:120px;min-width:0}.topbar h2{display:none}}
@media(max-width:600px){.profile-grid{grid-template-columns:1fr}.paper-hero{grid-template-columns:1fr 1fr}.shadow-strip{align-items:flex-start;flex-direction:column}}

/* Pier v2.1: calendar, planner explanations, true pay periods, stocks + options */
.calendar-shell{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--line);gap:1px}
.cal-head{background:var(--panel2);padding:9px;text-align:center;font-size:10px;font-weight:850;color:var(--muted);text-transform:uppercase}
.cal-day{min-height:112px;background:var(--panel);padding:8px;overflow:hidden}
.cal-day.other{opacity:.46}.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-num{font-size:11px;font-weight:850;margin-bottom:6px}
.cal-event{font-size:9px;line-height:1.25;padding:4px 5px;border-radius:6px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel3);border-left:3px solid var(--accent2)}
.cal-event.bill{border-color:var(--danger)}.cal-event.pay{border-color:var(--ok)}.cal-event.shift{border-color:var(--accent2)}.cal-event.task{border-color:var(--warn)}.cal-event.appt{border-color:#b48cff}
.timeline{display:grid;gap:8px;max-height:760px;overflow:auto}
.timeline-item{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.timeline-date{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.score-part{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:10px}
.plan-detail{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--panel2)}
.chart-wrap{height:180px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);display:grid;place-items:center;overflow:hidden}
.chart-wrap svg{width:100%;height:100%}
.watchlist{display:flex;gap:7px;flex-wrap:wrap}
.watch-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:850}
.contract{font-size:10px;color:var(--muted)}
@media(max-width:1100px){.calendar-shell{grid-template-columns:1fr}}
@media(max-width:700px){.cal-day{min-height:82px;padding:5px}.cal-event{font-size:8px;padding:3px}.score-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<section id="authScreen">
  <div class="auth-card">
    <div class="logo"><div class="logo-mark">P</div><span>Pier Life Tracker</span></div>
    <h1>Run your life on a plan.</h1>
    <p>No chatbot. No motivational fluff. Pier turns money, deadlines, must-do items and goals into a ranked action plan.</p>
    <div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v):0;

const localDateTimeValue=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)};
const daysUntil=v=>{if(!v)return 9999;const d=new Date(v.length<=10?v+"T23:59:59":v);return Math.ceil((d-new Date())/86400000)};
const fmtDate=v=>{if(!v)return "No deadline";const d=new Date(v.length<=10?v+"T12:00:00":v);return d.toLocaleDateString([], {month:"short",day:"numeric",year:d.getFullYear()!==new Date().getFullYear()?"numeric":undefined})+(v.includes("T")?" · "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"")};

const S={

  tasks:[],accounts:[],transactions:[],bills:[],goals:[],routines:[],inbox:[],
  jobs:[],shifts:[],timeEntries:[],paychecks:[],household:[],appointments:[],shopping:[],paperTrades:[],
  all:{},activeProfileId:localStorage.getItem("pierProfile")||"primary",worldMode:localStorage.getItem("pierWorld")||"live",
  unsubs:[],view:"dashboard",syncError:"",taskSearch:"",taskFilter:"open",plan:null,calendarCursor:new Date()
};
if(!["live","shadow"].includes(S.worldMode))S.worldMode="live";

function currentProfile(){
  return S.profiles.find(p=>p.id===S.activeProfileId)||S.profiles.find(p=>p.id==="primary")||{id:"primary",name:S.profile.name||"Pier",relation:"Me",paperCashLive:10000,paperCashShadow:10000};
}
function ctxFields(){return {profileId:S.activeProfileId,world:S.worldMode}}
function belongsToContext(d){
  return (d.profileId||"primary")===S.activeProfileId && (d.world||"live")===S.worldMode;
}
function applyContextData(){
  DATA_COLLECTIONS.forEach(name=>{
    S[name]=(S.all[name]||[]).filter(belongsToContext);
    sortData(name);
  });

}
function contextCounts(pid,world){
  const out={};DATA_COLLECTIONS.forEach(n=>out[n]=(S.all[n]||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")===world).length);return out;
}
function updateContextUI(){
  const box=$("#contextSwitcher");if(!box)return;
  const list=S.profiles.length?S.profiles:[{id:"primary",name:"Pier"}];
  box.innerHTML='<select id="profileSwitcher" aria-label="Profile">'+list.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name||"Profile")+'</option>').join("")+'</select>'+
    '<select id="worldSwitcher" aria-label="World" class="'+(S.worldMode==="shadow"?"world-shadow":"")+'"><option value="live">LIVE</option><option value="shadow">SHADOW</option></select>';

  $("#profileSwitcher").onchange=e=>switchContext(e.target.value,S.worldMode);
  $("#worldSwitcher").onchange=e=>switchContext(S.activeProfileId,e.target.value);
}
async function switchContext(profileId,world){
  S.activeProfileId=profileId;S.worldMode=world;
  localStorage.setItem("pierProfile",profileId);localStorage.setItem("pierWorld",world);
  if(world==="shadow"){
    const hasShadow=DATA_COLLECTIONS.some(n=>(S.all[n]||[]).some(d=>(d.profileId||"primary")===profileId&&(d.world||"live")==="shadow"));
    const hasLive=DATA_COLLECTIONS.some(n=>(S.all[n]||[]).some(d=>(d.profileId||"primary")===profileId&&(d.world||"live")==="live"));
    if(!hasShadow&&hasLive){await cloneLiveToShadow(profileId,false)}
  }
  applyContextData();refresh();
}

function toast(message,type="ok"){
  const el=document.createElement("div");el.className="toast "+type;el.textContent=message;$("#toastWrap").appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

function showModal(title,html,onSubmit){
  $("#modalTitle").textContent=title;$("#modalBody").innerHTML=html;$("#modalBackdrop").classList.remove("hidden");

  setTimeout(()=>$("#modalBody input:not([type=hidden]),#modalBody textarea")?.focus(),40);
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openTaskModal()} });

function friendlyError(err){
  const c=err?.code||"";if(c.includes("invalid-credential"))return "Wrong email or password.";
  if(c.includes("email-already-in-use"))return "That email already has an account.";
  if(c.includes("weak-password"))return "Password needs at least 6 characters.";
  if(c.includes("configuration-not-found"))return "Firebase Authentication is not enabled yet. In Firebase open Authentication → Get started → Sign-in method → Email/Password → Enable, then try again.";
  if(c.includes("operation-not-allowed"))return "Email/Password sign-in is disabled. Firebase → Authentication → Sign-in method → Email/Password → Enable.";
  if(c.includes("unauthorized-domain"))return "Add novaeriahengine.github.io under Firebase Authentication → Settings → Authorized domains.";
  if(c.includes("permission-denied"))return "Firestore denied access. Enable Email/Password Auth and publish the included firestore.rules.";
  return err?.message||"Something failed.";
}

$("#signInBtn").onclick=async()=>{try{setAuthStatus("Signing in…");await signInWithEmailAndPassword(auth,$("#authEmail").value.trim(),$("#authPassword").value)}catch(e){setAuthStatus(friendlyError(e),true)}};
$("#signUpBtn").onclick=async()=>{try{setAuthStatus("Creating account…");await createUserWithEmailAndPassword(auth,$("#authEmail").value.trim(),$("#authPassword").value)}catch(e){setAuthStatus(friendlyError(e),true)}};

onAuthStateChanged(auth,async user=>{
  stopListeners();S.user=user;
  if(!user){$("#authScreen").classList.remove("hidden");$("#appShell").classList.add("hidden");return}

  await bootstrapUser();startListeners();navigate("dashboard");
});

function userDoc(){return doc(db,"users",S.user.uid)}
function subcol(name){return collection(db,"users",S.user.uid,name)}
function subdoc(name,id){return doc(db,"users",S.user.uid,name,id)}
async function bootstrapUser(){
  try{
    const p=await getDoc(userDoc());
    if(!p.exists())await setDoc(userDoc(),{...DEFAULT_PROFILE,email:S.user.email||"",createdAt:serverTimestamp()});
    const primary=await getDoc(subdoc("profiles","primary"));
    if(!primary.exists())await setDoc(subdoc("profiles","primary"),{name:(S.user.email||"Pier").split("@")[0],relation:"Me",paperCashLive:10000,paperCashShadow:10000,createdAt:serverTimestamp()});
    const cash=await getDoc(subdoc("accounts","cash"));
    if(!cash.exists())await setDoc(subdoc("accounts","cash"),{name:"Cash",type:"cash",openingBalance:0,profileId:"primary",world:"live",createdAt:serverTimestamp()});
  }catch(e){setSyncError(e)}
}
function stopListeners(){S.unsubs.forEach(u=>{try{u()}catch{}});S.unsubs=[]}
function startListeners(){
  stopListeners();S.syncError="";
  S.unsubs.push(onSnapshot(userDoc(),snap=>{if(snap.exists()){S.profile={...DEFAULT_PROFILE,...snap.data()};applyTheme();refresh()}setSynced()},setSyncError));
  S.unsubs.push(onSnapshot(subcol("profiles"),snap=>{
    S.profiles=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(S.profiles.length&&!S.profiles.some(p=>p.id===S.activeProfileId)){S.activeProfileId=S.profiles[0].id;localStorage.setItem("pierProfile",S.activeProfileId)}
    updateContextUI();refresh();setSynced();
  },setSyncError));
  DATA_COLLECTIONS.forEach(name=>{
    S.unsubs.push(onSnapshot(subcol(name),snap=>{
      S.all[name]=snap.docs.map(d=>({id:d.id,...d.data()}));
      applyContextData();refresh();setSynced();
    },setSyncError));
  });
}
function sortData(name){
  if(name==="transactions")S.transactions.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  if(name==="tasks")S.tasks.sort((a,b)=>scoreAction(toTaskAction(b))-scoreAction(toTaskAction(a)));
  if(name==="bills")S.bills.sort((a,b)=>String(a.dueDate||"9999").localeCompare(String(b.dueDate||"9999")));
  if(name==="inbox")S.inbox.sort((a,b)=>(b.createdMs||0)-(a.createdMs||0));
  if(name==="shifts")S.shifts.sort((a,b)=>(String(a.date||"")+String(a.start||"")).localeCompare(String(b.date||"")+String(b.start||"")));
  if(name==="timeEntries")S.timeEntries.sort((a,b)=>String(b.startAt||"").localeCompare(String(a.startAt||"")));
  if(name==="paychecks")S.paychecks.sort((a,b)=>String(b.payDate||"").localeCompare(String(a.payDate||"")));
  if(name==="appointments")S.appointments.sort((a,b)=>String(a.dateTime||"").localeCompare(String(b.dateTime||"")));
  if(name==="shopping")S.shopping.sort((a,b)=>Number(!!a.done)-Number(!!b.done)||Number(!!b.must)-Number(!!a.must));
  if(name==="paperTrades")S.paperTrades.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
}
function setSynced(){
  if(S.syncError)return;$("#syncDot").className="dot ok";$("#syncLabel").textContent="Synced";$("#syncDetail").textContent=esc(currentProfile().name||"Profile")+" · "+S.worldMode.toUpperCase();
  $("#setupBanner").classList.add("hidden");
}
function setSyncError(err){
  S.syncError=friendlyError(err);$("#syncDot").className="dot bad";$("#syncLabel").textContent="Needs setup";$("#syncDetail").textContent="Firestore blocked";
  $("#setupMessage").textContent=S.syncError;$("#setupBanner").classList.remove("hidden");
}
function applyTheme(){document.documentElement.dataset.theme=S.profile.theme==="light"?"light":"dark"}

function navigate(view){
  S.view=view;const titles={dashboard:"Dashboard",tasks:"Tasks",money:"Money",goals:"Goals",routines:"Routines",planner:"Planner / Why",calendar:"Calendar",work:"Work & Pay",life:"Family & Life",paper:"Paper Markets",profiles:"Profiles",inbox:"Inbox",settings:"Settings"};
  $("#pageTitle").textContent=titles[view]||"Pier";
  $$("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  render();

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-view]");if(nav){navigate(nav.dataset.view);return}

function refresh(){

  if($("#appShell").classList.contains("hidden"))return;
  render();
}
function render(){
  const root=$("#viewRoot");if(!root)return;
  let html="";
  if(S.view==="dashboard")html=renderDashboard();
  else if(S.view==="tasks")html=renderTasks();
  else if(S.view==="money")html=renderMoney();
  else if(S.view==="goals")html=renderGoals();
  else if(S.view==="routines")html=renderRoutines();
  else if(S.view==="planner")html=renderPlanner();
  else if(S.view==="calendar")html=renderCalendar();
  else if(S.view==="work")html=renderWork();
  else if(S.view==="life")html=renderLife();
  else if(S.view==="paper")html=renderPaper();

  const shadow=S.worldMode==="shadow"?'<div class="shadow-strip"><div><strong>SHADOW WORLD</strong><div class="small muted">Safe sandbox for '+esc(currentProfile().name||"this profile")+'. Changes here do not change LIVE money, goals, work or tasks.</div></div><button class="btn" data-action="reset-shadow" data-id="'+esc(S.activeProfileId)+'">Reset from LIVE</button></div>':"";
  root.innerHTML=shadow+html;
  updateContextUI();bindViewInputs();
}

function balances(){
  const map={};S.accounts.forEach(a=>map[a.id]=num(a.openingBalance));
  S.transactions.forEach(t=>{if(map[t.accountId]===undefined)map[t.accountId]=0;map[t.accountId]+=t.type==="income"?num(t.amount):-num(t.amount)});
  return map;
}
function totalBalance(){return Object.values(balances()).reduce((a,b)=>a+b,0)}
function monthFlow(){
  const now=new Date(),ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  return S.transactions.filter(t=>String(t.date||"").startsWith(ym)).reduce((o,t)=>{o[t.type]+=num(t.amount);return o},{income:0,expense:0});
}
function openTasks(){return S.tasks.filter(t=>t.status!=="done")}
function overdueCount(){return openTasks().filter(t=>t.dueAt&&daysUntil(t.dueAt)<0).length}
function mustCount(){return openTasks().filter(t=>t.must).length}
function dueSoonCount(){return openTasks().filter(t=>t.dueAt&&daysUntil(t.dueAt)>=0&&daysUntil(t.dueAt)<=num(S.profile.urgentDays)).length}
function availableMoney(){return totalBalance()-num(S.profile.emergencyReserve)}

function toTaskAction(t){return {key:"task:"+t.id,type:"task",id:t.id,title:t.title||"Untitled",priority:num(t.priority)||3,must:!!t.must,due:t.dueAt||"",minutes:Math.max(1,num(t.estimateMin)||15),cashCost:Math.max(0,num(t.moneyCost)),category:t.category||"General"}}
function toBillAction(b){return {key:"bill:"+b.id,type:"bill",id:b.id,title:"Pay "+(b.name||"bill"),priority:num(b.priority)||5,must:true,due:b.dueDate||"",minutes:5,cashCost:Math.max(0,num(b.amount)),category:"Bill"}}
function routineDue(r){
  if(!r.active)return false;const day=new Date().getDay();const days=Array.isArray(r.days)?r.days.map(Number):[];
  return (days.length===0||days.includes(day))&&r.lastCompletedDate!==today();
}
function toRoutineAction(r){return {key:"routine:"+r.id,type:"routine",id:r.id,title:r.name||"Routine",priority:num(r.priority)||3,must:!!r.must,due:today(),minutes:Math.max(1,num(r.estimateMin)||15),cashCost:0,category:"Routine"}}
function toGoalAction(g){return {key:"goal:"+g.id,type:"goal",id:g.id,title:g.nextAction||("Work on "+g.name),priority:num(g.priority)||3,must:false,due:g.deadline||"",minutes:Math.max(1,num(g.nextActionMinutes)||30),cashCost:0,category:"Goal"}}
function allActions(){
  return [
    ...openTasks().map(toTaskAction),
    ...S.bills.filter(b=>b.status!=="paid").map(toBillAction),
    ...S.routines.filter(routineDue).map(toRoutineAction),
    ...S.goals.filter(g=>g.status!=="done"&&g.nextAction).map(toGoalAction)
  ];
}
function scoreAction(a){
  let score=(num(a.priority)||3)*14;const d=daysUntil(a.due);
  if(a.must)score+=85;
  if(d<0)score+=135+Math.min(70,Math.abs(d)*7);
  else if(d===0)score+=100;
  else if(d===1)score+=72;
  else if(d<=3)score+=48;
  else if(d<=7)score+=26;
  if(a.type==="bill")score+=24;if(a.type==="routine")score+=10;
  if(a.minutes<=20)score+=5;
  return Math.round(score);
}
function whyAction(a){
  const r=[],d=daysUntil(a.due);
  if(a.must)r.push("HAVE TO");
  if(d<0)r.push(Math.abs(d)+"d overdue");else if(d===0)r.push("due today");else if(d===1)r.push("due tomorrow");else if(d<=7)r.push("due in "+d+"d");
  r.push("P"+(a.priority||3));r.push(a.minutes+" min");
  if(a.cashCost)r.push(money(a.cashCost));
  return r.join(" · ");
}


function scoreBreakdown(a){
  const d=daysUntil(a.due),parts=[];
  const priority=(num(a.priority)||3)*14;parts.push(["Priority P"+(a.priority||3),priority]);
  if(a.must)parts.push(["HAVE TO",85]);
  if(d<0)parts.push([Math.abs(d)+"d overdue",135+Math.min(70,Math.abs(d)*7)]);
  else if(d===0)parts.push(["Due today",100]);
  else if(d===1)parts.push(["Due tomorrow",72]);
  else if(d<=3)parts.push(["Due ≤3d",48]);
  else if(d<=7)parts.push(["Due ≤7d",26]);
  if(a.type==="bill")parts.push(["Bill",24]);
  if(a.type==="routine")parts.push(["Routine",10]);
  if(a.minutes<=20)parts.push(["Quick win",5]);
  return parts;
}

function generatePlan(){
  const actions=allActions().sort((a,b)=>scoreAction(b)-scoreAction(a));
  const world={minutes:Math.max(30,num(S.profile.dailyMinutes)||240),cash:Math.max(0,availableMoney())};
  const initial={...world},selected=[],blocked=[];
  for(const a of actions){
    const urgent=daysUntil(a.due)<=num(S.profile.urgentDays);
    const worth=a.must||urgent||scoreAction(a)>=75;
    if(!worth)continue;
    const fail=[];
    if(a.cashCost>world.cash)fail.push("needs "+money(a.cashCost)+" but spendable cash is "+money(world.cash));
    if(a.minutes>world.minutes)fail.push("needs "+a.minutes+" min but only "+world.minutes+" min remain");
    if(fail.length){
      if(a.must||urgent)blocked.push({...a,reason:fail.join("; "),score:scoreAction(a)});
      continue;
    }
    selected.push({...a,score:scoreAction(a),reason:whyAction(a)});
    world.minutes-=a.minutes;world.cash-=a.cashCost;
  }
  return {selected,blocked,initial,remaining:world,generatedAt:new Date()};
}

function payDateSeries(job,start,end){
  if(!job?.nextPayDate)return [];
  const out=[],step=frequencyDays(job.payFrequency),d=new Date(job.nextPayDate+"T12:00:00"),s=new Date(start+"T00:00:00"),e=new Date(end+"T23:59:59");
  let guard=0;
  while(d>s&&guard++<200){if(job.payFrequency==="monthly")d.setMonth(d.getMonth()-1);else d.setDate(d.getDate()-step)}
  guard=0;
  while(d<=e&&guard++<300){
    if(d>=s)out.push(d.toISOString().slice(0,10));
    if(job.payFrequency==="monthly")d.setMonth(d.getMonth()+1);else d.setDate(d.getDate()+step);
  }
  return out;
}
function calendarEvents(start,end){
  const ev=[];
  S.tasks.filter(t=>t.dueAt).forEach(t=>ev.push({date:String(t.dueAt).slice(0,10),kind:"task",title:t.title,meta:t.status==="done"?"done":"task"}));
  S.bills.filter(b=>b.dueDate).forEach(b=>ev.push({date:b.dueDate,kind:"bill",title:(b.status==="paid"?"Paid ":"Bill ")+b.name,meta:money(b.amount)}));
  S.shifts.forEach(s=>ev.push({date:s.date,kind:"shift",title:jobName(s.jobId)+" "+s.start+"–"+s.end,meta:shiftHours(s).toFixed(1)+"h"}));
  S.appointments.filter(a=>a.dateTime).forEach(a=>ev.push({date:String(a.dateTime).slice(0,10),kind:"appt",title:a.title,meta:a.person||""}));
  S.paychecks.forEach(p=>ev.push({date:p.payDate,kind:"pay",title:"Paid "+money(p.netAmount),meta:jobName(p.jobId)}));
  S.jobs.forEach(j=>payDateSeries(j,start,end).forEach(d=>ev.push({date:d,kind:"pay",title:"Expected payday",meta:j.name})));
  return ev.filter(x=>x.date>=start&&x.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
}
function renderCalendar(){

  }
  const rangeStart=new Date(year,month-2,1).toISOString().slice(0,10),rangeEnd=new Date(year,month+3,0).toISOString().slice(0,10),timeline=calendarEvents(rangeStart,rangeEnd);
  return '<div class="section-title"><div><h1>Calendar</h1><p>One calendar for shifts, biweekly paydays, bills, task deadlines and family appointments.</p></div><div class="toolbar"><button class="btn" data-action="cal-prev">←</button><button class="btn" data-action="cal-today">Today</button><button class="btn" data-action="cal-next">→</button></div></div>'+
    '<div class="calendar-shell"><section><div class="card pad"><div class="card-head"><h3>'+cur.toLocaleDateString([],{month:"long",year:"numeric"})+'</h3><span class="pill blue">'+events.length+' events</span></div><div class="calendar-grid">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>'<div class="cal-head">'+x+'</div>').join("")+cells.join("")+'</div></div></section>'+
    '<aside class="card pad"><div class="card-head"><h3>Past + future timeline</h3><span class="small muted">5-month window</span></div><div class="timeline">'+(timeline.length?timeline.map(e=>'<div class="timeline-item"><div class="timeline-date">'+fmtDate(e.date)+'</div><div class="task-title">'+esc(e.title)+'</div><div class="row-meta">'+esc(e.meta||e.kind)+'</div></div>').join(""):'<div class="empty">No calendar items.</div>')+'</div></aside></div>'+

function cloneDataObject(d,pid,world){
  const x={...d};delete x.id;delete x.createdAt;delete x.updatedAt;delete x.completedAt;delete x.convertedAt;
  x.profileId=pid;x.world=world;x.updatedAt=serverTimestamp();x.createdAt=serverTimestamp();return x;
}
async function cloneLiveToShadow(pid,ask=true){
  if(ask&&!confirm("Reset this profile's SHADOW world from LIVE? Current shadow changes will be erased."))return;
  toast("Rebuilding shadow…");
  const shadowDocs=[];DATA_COLLECTIONS.forEach(n=>(S.all[n]||[]).forEach(d=>{if((d.profileId||"primary")===pid&&(d.world||"live")==="shadow")shadowDocs.push([n,d.id])}));
  for(const [n,id] of shadowDocs)await deleteDoc(subdoc(n,id));
  const accountMap={},jobMap={};
  const liveAccounts=(S.all.accounts||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="live");
  for(const d of liveAccounts){const r=await addDoc(subcol("accounts"),cloneDataObject(d,pid,"shadow"));accountMap[d.id]=r.id}
  const liveJobs=(S.all.jobs||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="live");
  for(const d of liveJobs){const r=await addDoc(subcol("jobs"),cloneDataObject(d,pid,"shadow"));jobMap[d.id]=r.id}
  for(const n of DATA_COLLECTIONS){
    if(n==="accounts"||n==="jobs")continue;
    const docs=(S.all[n]||[]).filter(d=>(d.profileId||"primary")===pid&&(d.world||"live")==="live");
    for(const d of docs){
      const x=cloneDataObject(d,pid,"shadow");
      if(x.accountId&&accountMap[x.accountId])x.accountId=accountMap[x.accountId];
      if(x.jobId&&jobMap[x.jobId])x.jobId=jobMap[x.jobId];
      await addDoc(subcol(n),x);
    }
  }
  const p=S.profiles.find(x=>x.id===pid);
  if(p)await setDoc(subdoc("profiles",pid),{paperCashShadow:num(p.paperCashLive||10000)},{merge:true});
  toast("Shadow refreshed from LIVE.");
}
async function deleteProfile(id){
  if(!id||id==="primary")return toast("The primary profile cannot be deleted.","error");
  const p=S.profiles.find(x=>x.id===id);if(!confirm("Delete "+(p?.name||"this profile")+" and all LIVE + SHADOW data?"))return;
  for(const n of DATA_COLLECTIONS){
    const docs=(S.all[n]||[]).filter(d=>(d.profileId||"primary")===id);
    for(const d of docs)await deleteDoc(subdoc(n,d.id));
  }
  await deleteDoc(subdoc("profiles",id));await switchContext("primary","live");toast("Profile deleted.");
}

/* WORK & PAY */
function jobName(id){return S.jobs.find(j=>j.id===id)?.name||"Job"}
function entryHours(e){
  if(e.hours!==undefined&&e.hours!==null&&e.status!=="open")return num(e.hours);
  const a=e.startMs||Date.parse(e.startAt||""),b=e.endAt?Date.parse(e.endAt):Date.now();if(!a||!b||b<a)return 0;
  return Math.max(0,(b-a)/3600000-num(e.breakMin)/60);
}
function shiftHours(s){
  if(!s.start||!s.end)return 0;
  const [sh,sm]=s.start.split(":").map(Number),[eh,em]=s.end.split(":").map(Number);let mins=(eh*60+em)-(sh*60+sm);if(mins<0)mins+=1440;
  return Math.max(0,(mins-num(s.breakMin))/60);
}
function weekKey(dateLike){
  const d=new Date(dateLike);if(isNaN(d))return "";
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x.toISOString().slice(0,10);
}
function frequencyDays(f){return f==="weekly"?7:f==="biweekly"?14:f==="semimonthly"?15:30}
function nextPayDate(job){
  if(!job?.nextPayDate)return "";
  let d=new Date(job.nextPayDate+"T12:00:00"),guard=0;const days=frequencyDays(job.payFrequency);
  while(d<new Date(new Date().toDateString())&&guard++<30){if(job.payFrequency==="monthly")d.setMonth(d.getMonth()+1);else d.setDate(d.getDate()+days)}
  return d.toISOString().slice(0,10);
}
function payWindow(job){
  const pay=nextPayDate(job);if(!pay)return {start:"",end:"",payDate:""};
  const payDate=new Date(pay+"T12:00:00"),periodEnd=new Date(payDate),lag=Math.max(0,num(job.payPeriodLagDays||0));
  periodEnd.setDate(periodEnd.getDate()-lag);
  const periodStart=new Date(periodEnd);
  if(job.payFrequency==="monthly")periodStart.setMonth(periodStart.getMonth()-1);
  else periodStart.setDate(periodStart.getDate()-frequencyDays(job.payFrequency));
  return {start:periodStart.toISOString().slice(0,10),end:periodEnd.toISOString().slice(0,10),payDate:pay};
}
function estimatePay(job){
  if(!job)return {hours:0,regular:0,ot:0,gross:0,net:0,scheduled:0};
  const w=payWindow(job),entries=S.timeEntries.filter(e=>e.jobId===job.id&&e.startAt&&(!w.start||String(e.startAt).slice(0,10)>=w.start)&&(!w.end||String(e.startAt).slice(0,10)<w.end));
  const groups={};entries.forEach(e=>{const k=weekKey(e.startAt);groups[k]=(groups[k]||0)+entryHours(e)});
  let regular=0,ot=0;const threshold=num(job.overtimeThreshold||40);
  Object.values(groups).forEach(h=>{regular+=Math.min(h,threshold);ot+=Math.max(0,h-threshold)});
  const rate=num(job.hourlyRate),mult=num(job.overtimeMultiplier||1.5),gross=regular*rate+ot*rate*mult,net=gross*(1-num(job.taxPercent||0)/100);
  const scheduled=S.shifts.filter(s=>s.jobId===job.id&&(!w.start||s.date>=w.start)&&(!w.end||s.date<w.end)).reduce((a,s)=>a+shiftHours(s),0);
  return {hours:regular+ot,regular,ot,gross,net,scheduled,window:w};
}
function activeClock(){return S.timeEntries.find(e=>e.status==="open"&&!e.endAt)}
function thisWeekHours(){const k=weekKey(new Date());return S.timeEntries.filter(e=>weekKey(e.startAt)===k).reduce((a,e)=>a+entryHours(e),0)}

    '<div class="money-hero" style="margin-top:18px">'+metric("This week",thisWeekHours().toFixed(2)+" h","Actual tracked time")+metric("Est. gross",money(gross),"Current pay windows")+metric("Est. net",money(net),"After your tax estimate")+metric("Jobs",S.jobs.length,S.shifts.filter(s=>s.date>=today()).length+" upcoming shifts")+'</div>'+

/* PAPER MARKETS */
function paperStartingCash(){const p=currentProfile();return num(S.worldMode==="shadow"?(p.paperCashShadow??10000):(p.paperCashLive??10000))}
function paperKey(t){
  const s=String(t.symbol||"").toUpperCase();
  if((t.instrument||"stock")==="option")return "OPT:"+s+":"+String(t.expiration||"")+":"+String(t.optionType||"call").toUpperCase()+":"+num(t.strike);
  return "STOCK:"+s;
}
function paperLabel(t){
  const s=String(t.symbol||"").toUpperCase();
  return (t.instrument||"stock")==="option"?s+" "+String(t.expiration||"")+" $"+num(t.strike)+" "+String(t.optionType||"call").toUpperCase():s;
}
function tradeMultiplier(t){return (t.instrument||"stock")==="option"?100:1}
function paperState(){
  const positions={};let cash=paperStartingCash();
  [...S.paperTrades].sort((a,b)=>String(a.dateTime||a.date||"").localeCompare(String(b.dateTime||b.date||""))).forEach(t=>{
    const key=paperKey(t),q=num(t.qty),p=num(t.price),m=tradeMultiplier(t);if(!t.symbol)return;
    if(!positions[key])positions[key]={key,symbol:String(t.symbol).toUpperCase(),instrument:t.instrument||"stock",optionType:t.optionType||"",expiration:t.expiration||"",strike:num(t.strike),qty:0,cost:0,lastPrice:p,multiplier:m,label:paperLabel(t)};
    const pos=positions[key];pos.lastPrice=p;
    if(t.side==="buy"){cash-=q*p*m;pos.qty+=q;pos.cost+=q*p*m}
    if(t.side==="sell"){cash+=q*p*m;const oldQty=Math.max(pos.qty,.0000001),avgUnit=(pos.cost/oldQty)/m;pos.qty-=q;pos.cost=Math.max(0,pos.cost-avgUnit*q*m)}
  });
  const list=Object.values(positions).filter(x=>Math.abs(x.qty)>.000001).map(x=>({...x,value:x.qty*x.lastPrice*x.multiplier,avg:x.qty?(x.cost/x.qty/x.multiplier):0,pnl:x.qty*x.lastPrice*x.multiplier-x.cost}));
  const market=list.reduce((a,x)=>a+x.value,0),equity=cash+market,start=paperStartingCash();
  return {cash,market,equity,pnl:equity-start,positions:list};
}
function paperSeries(key){
  return S.paperTrades.filter(t=>paperKey(t)===key&&num(t.price)>0).sort((a,b)=>String(a.dateTime||a.date||"").localeCompare(String(b.dateTime||b.date||""))).map(t=>({x:t.dateTime||t.date||today(),y:num(t.price)}));
}
function paperChart(series){
  if(!series.length)return '<div class="empty">Record prices or trades to build the chart.</div>';
  const vals=series.map(x=>x.y),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,w=600,h=170,pad=14;
  const pts=series.map((x,i)=>{const px=series.length===1?w/2:pad+i*(w-2*pad)/(series.length-1),py=h-pad-(x.y-min)/span*(h-2*pad);return px.toFixed(1)+","+py.toFixed(1)}).join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img"><line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="currentColor" opacity=".12"/><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="3" vector-effect="non-scaling-stroke"/><text x="'+pad+'" y="16" fill="currentColor" opacity=".65" font-size="10">'+money(max)+'</text><text x="'+pad+'" y="'+(h-4)+'" fill="currentColor" opacity=".65" font-size="10">'+money(min)+'</text></svg>';
}

  const examples=["SPY","QQQ","AAPL","NVDA","TSLA"];
  return '<div class="section-title"><div><h1>Paper Stocks & Options</h1><p>Realistic manual simulator: stock shares and option contracts, 100× contract multiplier, price marks and P/L. Still no real orders.</p></div><div class="toolbar"><button class="btn" data-action="set-paper-cash">Set paper cash</button><button class="btn primary" data-action="paper-trade">＋ Trade / mark</button></div></div>'+
    '<div class="paper-hero">'+metric("Paper equity",money(p.equity),"Cash + marked positions")+metric("Paper cash",money(p.cash),"Starting "+money(paperStartingCash()))+metric("Market value",money(p.market),p.positions.length+" open positions")+metric("Paper P/L",money(p.pnl),p.pnl>=0?"Profit vs starting equity":"Loss vs starting equity")+'</div>'+
    '<section class="card pad" style="margin-bottom:18px"><div class="card-head"><h3>Quick examples</h3><span class="small muted">These buttons only prefill a manual ticket; they are not live quotes.</span></div><div class="watchlist">'+examples.map(s=>'<button class="watch-btn" data-action="paper-sample-stock" data-id="'+s+'">'+s+' stock</button>').join("")+'<button class="watch-btn" data-action="paper-sample-option" data-id="SPY">SPY option</button><button class="watch-btn" data-action="paper-sample-option" data-id="QQQ">QQQ option</button></div></section>'+

    '<section class="card pad" style="margin-top:18px"><div class="small muted" style="line-height:1.6"><strong>Simulator boundary:</strong> prices are manual in this GitHub-only version. Pier does not pretend sample prices are live. The structure now supports stock shares and call/put option contracts so a future market-data connector can feed the same paper engine.</div></section>';

function openPaperTradeModal(prefill={}){
  const st=paperState(),future=new Date(Date.now()+30*86400000),exp=future.toISOString().slice(0,10);
  showModal("Paper stock / option ticket",'<form><div class="modal-grid"><div class="field"><label>Instrument</label><select name="instrument"><option value="stock">Stock</option><option value="option">Option contract</option></select></div><div class="field"><label>Action</label><select name="side"><option value="buy">BUY</option><option value="sell">SELL</option><option value="mark">MARK PRICE ONLY</option></select></div><div class="field"><label>Symbol</label><input name="symbol" required value="'+esc(prefill.symbol||"")+'" placeholder="SPY"></div><div class="field"><label>Quantity / contracts</label><input name="qty" type="number" min="0" step=".0001" value="'+esc(prefill.qty||1)+'"></div><div class="field"><label>Price / option premium</label><input name="price" type="number" min="0" step=".0001" value="'+esc(prefill.price||"")+'" required></div><div class="field"><label>Date & time</label><input name="dateTime" type="datetime-local" value="'+localDateTimeValue()+'"></div></div><div id="optionFields"><div class="modal-grid"><div class="field"><label>Call / Put</label><select name="optionType"><option value="call">CALL</option><option value="put">PUT</option></select></div><div class="field"><label>Strike</label><input name="strike" type="number" min="0" step=".01" value="'+esc(prefill.strike||"")+'"></div><div class="field"><label>Expiration</label><input name="expiration" type="date" value="'+esc(prefill.expiration||exp)+'"></div><div class="field"><label>Contract multiplier</label><input value="100 shares" disabled></div></div></div><div class="small muted">Available paper cash: '+money(st.cash)+'. Option premium is multiplied by 100 per contract.</div><div class="modal-foot"><button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Record</button></div></form>',async fd=>{

  });

async function handleAction(action,id,el){
  if(action==="add-task")return openTaskModal();
  if(action==="edit-task")return openTaskModal(S.tasks.find(x=>x.id===id));
  if(action==="done-task")return completeTask(id);
  if(action==="reopen-task")return updateDoc(subdoc("tasks",id),{status:"open",completedAt:null,updatedAt:serverTimestamp()});
  if(action==="add-account")return openAccountModal();
  if(action==="edit-account")return openAccountModal(S.accounts.find(x=>x.id===id));
  if(action==="add-transaction")return openTransactionModal();
  if(action==="delete-transaction")return removeDoc("transactions",id,"Delete this transaction?");
  if(action==="add-bill")return openBillModal();
  if(action==="edit-bill")return openBillModal(S.bills.find(x=>x.id===id));
  if(action==="pay-bill")return payBill(id);
  if(action==="add-goal")return openGoalModal();
  if(action==="edit-goal")return openGoalModal(S.goals.find(x=>x.id===id));
  if(action==="goal-progress")return openGoalProgress(S.goals.find(x=>x.id===id));
  if(action==="goal-done")return updateDoc(subdoc("goals",id),{status:"done",updatedAt:serverTimestamp()});
  if(action==="add-routine")return openRoutineModal();
  if(action==="edit-routine")return openRoutineModal(S.routines.find(x=>x.id===id));
  if(action==="routine-done")return updateDoc(subdoc("routines",id),{lastCompletedDate:today(),updatedAt:serverTimestamp()});
  if(action==="inbox-to-task")return inboxToTask(id);
  if(action==="delete-inbox")return removeDoc("inbox",id,"Delete this inbox item?");
  if(action==="complete-plan")return completePlanItem(id);
  if(action==="export-data")return exportData();
  if(action==="request-notifications")return requestNotifications();
  if(action==="replan-now"){S.plan=generatePlan();toast("Plan rebuilt.");return render()}
  if(action==="cal-prev"){S.calendarCursor=new Date(S.calendarCursor.getFullYear(),S.calendarCursor.getMonth()-1,1);return render()}
  if(action==="cal-next"){S.calendarCursor=new Date(S.calendarCursor.getFullYear(),S.calendarCursor.getMonth()+1,1);return render()}
  if(action==="cal-today"){S.calendarCursor=new Date();return render()}
  if(action==="add-profile")return openProfileModal();
  if(action==="use-live")return switchContext(id,"live");
  if(action==="use-shadow")return switchContext(id,"shadow");
  if(action==="reset-shadow")return cloneLiveToShadow(id||S.activeProfileId,true);
  if(action==="delete-profile")return deleteProfile(id);
  if(action==="add-job")return openJobModal();
  if(action==="edit-job")return openJobModal(S.jobs.find(x=>x.id===id));
  if(action==="add-shift")return openShiftModal();
  if(action==="delete-shift")return removeDoc("shifts",id,"Delete this scheduled shift?");
  if(action==="clock-in")return clockIn();
  if(action==="clock-out")return clockOut();
  if(action==="add-time")return openTimeModal();
  if(action==="delete-time")return removeDoc("timeEntries",id,"Delete this time entry?");
  if(action==="add-paycheck")return openPaycheckModal();
  if(action==="delete-paycheck")return removeDoc("paychecks",id,"Delete this paycheck record?");
  if(action==="add-person")return openPersonModal();
  if(action==="delete-person")return removeDoc("household",id,"Remove this household member?");
  if(action==="add-appointment")return openAppointmentModal();
  if(action==="delete-appointment")return removeDoc("appointments",id,"Delete this appointment?");
  if(action==="add-shopping")return openShoppingModal();
  if(action==="toggle-shopping")return toggleShopping(id);
  if(action==="delete-shopping")return removeDoc("shopping",id,"Delete this item?");
  if(action==="paper-trade")return openPaperTradeModal();
  if(action==="paper-sample-stock")return openPaperTradeModal({instrument:"stock",symbol:id,qty:1});
  if(action==="paper-sample-option")return openPaperTradeModal({instrument:"option",symbol:id,optionType:"call",qty:1});
  if(action==="set-paper-cash")return setPaperCashModal();
  if(action==="delete-paper-trade")return removeDoc("paperTrades",id,"Delete this paper trade?");
  if(action==="sign-out")return signOut(auth);
}
async function removeDoc(col,id,msg){if(confirm(msg))await deleteDoc(subdoc(col,id))}
async function completeTask(id){await updateDoc(subdoc("tasks",id),{status:"done",completedAt:serverTimestamp(),updatedAt:serverTimestamp()});toast("Task completed.")}
async function completePlanItem(key){
  const [type,id]=String(key).split(":");
  if(type==="task")return completeTask(id);
  if(type==="bill")return payBill(id);
  if(type==="routine"){await updateDoc(subdoc("routines",id),{lastCompletedDate:today(),updatedAt:serverTimestamp()});return toast("Routine completed.")}
  if(type==="goal"){const g=S.goals.find(x=>x.id===id);return g&&openGoalProgress(g)}
}

  const isEdit=!!t.id;
  showModal(isEdit?"Edit task":"Add task",
    '<form><div class="field"><label>What has to get done?</label><input name="title" maxlength="160" required value="'+esc(t.title||"")+'" placeholder="Pay rent, call school, finish engine patch…"></div>'+
    '<div class="modal-grid"><div class="field"><label>Priority</label><select name="priority">'+[1,2,3,4,5].map(x=>'<option value="'+x+'" '+(num(t.priority||3)===x?'selected':'')+'>P'+x+(x===5?' — critical':x===1?' — low':'')+'</option>').join("")+'</select></div>'+
    '<div class="field"><label>Category</label><input name="category" value="'+esc(t.category||"General")+'" placeholder="Home, Work, Family…"></div>'+
    '<div class="field"><label>Deadline</label><input name="dueAt" type="datetime-local" value="'+esc(t.dueAt||"")+'"></div>'+
    '<div class="field"><label>Time needed (minutes)</label><input name="estimateMin" type="number" min="1" value="'+num(t.estimateMin||30)+'"></div>'+
    '<div class="field"><label>Money required</label><input name="moneyCost" type="number" min="0" step=".01" value="'+num(t.moneyCost||0)+'"></div></div>'+
    '<label class="check"><input name="must" type="checkbox" '+(t.must?'checked':'')+'> <strong>HAVE TO</strong> — treat this as mandatory</label>'+
    '<div class="field"><label>Notes</label><textarea name="notes" placeholder="Anything you need when you come back to this…">'+esc(t.notes||"")+'</textarea></div>'+
    '<div class="modal-foot">'+(isEdit?'<button class="btn danger" type="button" id="deleteTaskBtn">Delete</button>':'')+'<button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>',
    async fd=>{
      const data={title:fd.get("title").trim(),priority:num(fd.get("priority")),category:fd.get("category").trim()||"General",dueAt:fd.get("dueAt")||"",estimateMin:num(fd.get("estimateMin"))||30,moneyCost:num(fd.get("moneyCost")),must:fd.get("must")==="on",notes:fd.get("notes").trim(),updatedAt:serverTimestamp()};
      if(isEdit)await updateDoc(subdoc("tasks",t.id),data);else await addDoc(subcol("tasks"),{...data,...ctxFields(),status:"open",createdAt:serverTimestamp()});
      toast(isEdit?"Task updated.":"Task added.");
    });
  $("#cancelModalBtn").onclick=closeModal;
  if(isEdit)$("#deleteTaskBtn").onclick=async()=>{if(confirm("Delete this task?")){await deleteDoc(subdoc("tasks",t.id));closeModal();toast("Task deleted.")}};
}

function openAccountModal(a={}){
  const isEdit=!!a.id;
  showModal(isEdit?"Adjust account":"Add account",
    '<form><div class="field"><label>Name</label><input name="name" required value="'+esc(a.name||"")+'" placeholder="Checking, Cash, Savings"></div><div class="modal-grid"><div class="field"><label>Type</label><select name="type"><option>checking</option><option>savings</option><option>cash</option><option>other</option></select></div><div class="field"><label>'+ (isEdit?"Set current balance":"Starting balance") +'</label><input name="balance" type="number" step=".01" value="'+(isEdit?num(balances()[a.id]):num(a.openingBalance))+'"></div></div><div class="modal-foot"><button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>',
    async fd=>{
      const name=fd.get("name").trim(),type=fd.get("type"),desired=num(fd.get("balance"));
      if(!isEdit)await addDoc(subcol("accounts"),{name,type,openingBalance:desired,...ctxFields(),createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      else{
        const current=num(balances()[a.id]),delta=desired-current;
        await updateDoc(subdoc("accounts",a.id),{name,type,updatedAt:serverTimestamp()});
        if(Math.abs(delta)>.004)await addDoc(subcol("transactions"),{type:delta>=0?"income":"expense",amount:Math.abs(delta),accountId:a.id,category:"Balance adjustment",description:"Balance adjustment",date:today(),...ctxFields(),createdAt:serverTimestamp()});
      }toast("Account saved.");
    });
  $("#cancelModalBtn").onclick=closeModal;if(isEdit)$("#modalBody select[name=type]").value=a.type||"checking";
}

function openTransactionModal(prefill={}){
  if(!S.accounts.length)return toast("Add an account first.","error");
  showModal("Add transaction",
    '<form><div class="modal-grid"><div class="field"><label>Type</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="field"><label>Amount</label><input name="amount" type="number" min=".01" step=".01" required value="'+esc(prefill.amount||"")+'"></div><div class="field"><label>Account</label><select name="accountId">'+S.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join("")+'</select></div><div class="field"><label>Date</label><input name="date" type="date" value="'+esc(prefill.date||today())+'"></div></div><div class="field"><label>Description</label><input name="description" value="'+esc(prefill.description||"")+'" placeholder="Groceries, paycheck, gas…"></div><div class="field"><label>Category</label><input name="category" value="'+esc(prefill.category||"Other")+'"></div><div class="modal-foot"><button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>',
    async fd=>{await addDoc(subcol("transactions"),{type:fd.get("type"),amount:num(fd.get("amount")),accountId:fd.get("accountId"),date:fd.get("date")||today(),description:fd.get("description").trim(),category:fd.get("category").trim()||"Other",...ctxFields(),createdAt:serverTimestamp()});toast("Transaction added.")});
  $("#cancelModalBtn").onclick=closeModal;
  if(prefill.type)$("#modalBody select[name=type]").value=prefill.type;if(prefill.accountId)$("#modalBody select[name=accountId]").value=prefill.accountId;
}

function openBillModal(b={}){
  const isEdit=!!b.id;
  showModal(isEdit?"Edit bill":"Add bill / obligation",
    '<form><div class="field"><label>Name</label><input name="name" required value="'+esc(b.name||"")+'" placeholder="Rent, phone, school, insurance…"></div><div class="modal-grid"><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" required value="'+num(b.amount||0)+'"></div><div class="field"><label>Due date</label><input name="dueDate" type="date" required value="'+esc(b.dueDate||today())+'"></div><div class="field"><label>Recurrence</label><select name="recurrence"><option value="none">One time</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div><div class="field"><label>Priority</label><select name="priority">'+[3,4,5].map(x=>'<option value="'+x+'" '+(num(b.priority||5)===x?'selected':'')+'>P'+x+'</option>').join("")+'</select></div></div><div class="modal-foot">'+(isEdit?'<button class="btn danger" type="button" id="deleteBillBtn">Delete</button>':'')+'<button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>',
    async fd=>{const data={name:fd.get("name").trim(),amount:num(fd.get("amount")),dueDate:fd.get("dueDate"),recurrence:fd.get("recurrence"),priority:num(fd.get("priority")),status:"open",updatedAt:serverTimestamp()};if(isEdit)await updateDoc(subdoc("bills",b.id),data);else await addDoc(subcol("bills"),{...data,...ctxFields(),createdAt:serverTimestamp()});toast("Bill saved.")});
  $("#cancelModalBtn").onclick=closeModal;$("#modalBody select[name=recurrence]").value=b.recurrence||"none";
  if(isEdit)$("#deleteBillBtn").onclick=async()=>{if(confirm("Delete this bill?")){await deleteDoc(subdoc("bills",b.id));closeModal()}};
}
function addPeriod(dateStr,recurrence){
  const d=new Date(dateStr+"T12:00:00");if(recurrence==="weekly")d.setDate(d.getDate()+7);if(recurrence==="monthly")d.setMonth(d.getMonth()+1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
async function payBill(id){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  if(!S.accounts.length)return toast("Add an account before paying a bill.","error");
  const opts=S.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+' · '+money(balances()[a.id]||0)+'</option>').join("");
  showModal("Pay "+b.name,'<form><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" value="'+num(b.amount)+'"></div><div class="field"><label>Pay from</label><select name="accountId">'+opts+'</select></div><div class="field"><label>Payment date</label><input name="date" type="date" value="'+today()+'"></div><div class="modal-foot"><button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Record payment</button></div></form>',
    async fd=>{
      const batch=writeBatch(db),txRef=doc(subcol("transactions"));
      batch.set(txRef,{type:"expense",amount:num(fd.get("amount")),accountId:fd.get("accountId"),date:fd.get("date"),description:b.name,category:"Bills",...ctxFields(),createdAt:serverTimestamp()});
      if(b.recurrence&&b.recurrence!=="none")batch.update(subdoc("bills",id),{dueDate:addPeriod(b.dueDate,b.recurrence),lastPaidDate:fd.get("date"),status:"open",updatedAt:serverTimestamp()});
      else batch.update(subdoc("bills",id),{status:"paid",lastPaidDate:fd.get("date"),updatedAt:serverTimestamp()});
      await batch.commit();toast("Payment recorded.");
    });
  $("#cancelModalBtn").onclick=closeModal;
}

function openGoalModal(g={}){
  const isEdit=!!g.id;
  showModal(isEdit?"Edit goal":"Add goal",
    '<form><div class="field"><label>Goal</label><input name="name" required value="'+esc(g.name||"")+'" placeholder="Emergency fund, finish project, lose clutter…"></div><div class="modal-grid"><div class="field"><label>Type</label><select name="kind"><option value="money">Money</option><option value="progress">Progress number</option></select></div><div class="field"><label>Priority</label><select name="priority">'+[1,2,3,4,5].map(x=>'<option value="'+x+'" '+(num(g.priority||3)===x?'selected':'')+'>P'+x+'</option>').join("")+'</select></div><div class="field"><label>Current</label><input name="current" type="number" step=".01" value="'+num(g.current)+'"></div><div class="field"><label>Target</label><input name="target" type="number" step=".01" value="'+num(g.target||100)+'"></div><div class="field"><label>Deadline</label><input name="deadline" type="date" value="'+esc(g.deadline||"")+'"></div><div class="field"><label>Next action time (min)</label><input name="nextActionMinutes" type="number" min="1" value="'+num(g.nextActionMinutes||30)+'"></div></div><div class="field"><label>Next physical action</label><input name="nextAction" value="'+esc(g.nextAction||"")+'" placeholder="Transfer $50, code login screen, call office…"></div><div class="modal-foot">'+(isEdit?'<button class="btn danger" type="button" id="deleteGoalBtn">Delete</button>':'')+'<button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>',
    async fd=>{const data={name:fd.get("name").trim(),kind:fd.get("kind"),priority:num(fd.get("priority")),current:num(fd.get("current")),target:num(fd.get("target")),deadline:fd.get("deadline"),nextAction:fd.get("nextAction").trim(),nextActionMinutes:num(fd.get("nextActionMinutes")),status:"open",updatedAt:serverTimestamp()};if(isEdit)await updateDoc(subdoc("goals",g.id),data);else await addDoc(subcol("goals"),{...data,...ctxFields(),createdAt:serverTimestamp()});toast("Goal saved.")});
  $("#cancelModalBtn").onclick=closeModal;$("#modalBody select[name=kind]").value=g.kind||"money";
  if(isEdit)$("#deleteGoalBtn").onclick=async()=>{if(confirm("Delete this goal?")){await deleteDoc(subdoc("goals",g.id));closeModal()}};
}
function openGoalProgress(g){
  showModal("Update "+g.name,'<form><div class="field"><label>Current progress</label><input name="current" type="number" step=".01" value="'+num(g.current)+'"></div><div class="field"><label>Next action</label><input name="nextAction" value="'+esc(g.nextAction||"")+'"></div><div class="modal-foot"><button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Update</button></div></form>',
    async fd=>{const cur=num(fd.get("current"));await updateDoc(subdoc("goals",g.id),{current:cur,nextAction:fd.get("nextAction").trim(),status:cur>=num(g.target)?"done":"open",updatedAt:serverTimestamp()});toast("Goal updated.")});
  $("#cancelModalBtn").onclick=closeModal;
}

function openRoutineModal(r={}){
  const isEdit=!!r.id,days=Array.isArray(r.days)?r.days.map(Number):[0,1,2,3,4,5,6];
  const checks=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d,i)=>'<label class="pill"><input style="width:auto" type="checkbox" name="day" value="'+i+'" '+(days.includes(i)?'checked':'')+'> '+d+'</label>').join("");
  showModal(isEdit?"Edit routine":"Add routine",
    '<form><div class="field"><label>Routine</label><input name="name" required value="'+esc(r.name||"")+'" placeholder="Laundry reset, gym, clean room…"></div><div class="field"><label>Days</label><div style="display:flex;gap:6px;flex-wrap:wrap">'+checks+'</div></div><div class="modal-grid"><div class="field"><label>Minutes</label><input name="estimateMin" type="number" min="1" value="'+num(r.estimateMin||20)+'"></div><div class="field"><label>Priority</label><select name="priority">'+[1,2,3,4,5].map(x=>'<option value="'+x+'" '+(num(r.priority||3)===x?'selected':'')+'>P'+x+'</option>').join("")+'</select></div></div><label class="check"><input name="must" type="checkbox" '+(r.must?'checked':'')+'> HAVE TO when scheduled</label><label class="check"><input name="active" type="checkbox" '+(r.active!==false?'checked':'')+'> Active</label><div class="modal-foot">'+(isEdit?'<button class="btn danger" type="button" id="deleteRoutineBtn">Delete</button>':'')+'<button class="btn ghost" type="button" id="cancelModalBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>',
    async fd=>{const data={name:fd.get("name").trim(),days:fd.getAll("day").map(Number),estimateMin:num(fd.get("estimateMin")),priority:num(fd.get("priority")),must:fd.get("must")==="on",active:fd.get("active")==="on",updatedAt:serverTimestamp()};if(isEdit)await updateDoc(subdoc("routines",r.id),data);else await addDoc(subcol("routines"),{...data,...ctxFields(),lastCompletedDate:"",createdAt:serverTimestamp()});toast("Routine saved.")});
  $("#cancelModalBtn").onclick=closeModal;if(isEdit)$("#deleteRoutineBtn").onclick=async()=>{if(confirm("Delete routine?")){await deleteDoc(subdoc("routines",r.id));closeModal()}};
}

async function saveInbox(e){
  e.preventDefault();const input=e.currentTarget.elements.text,text=input.value.trim();if(!text)return;
  await addDoc(subcol("inbox"),{text,converted:false,date:today(),createdMs:Date.now(),...ctxFields(),createdAt:serverTimestamp()});input.value="";toast("Captured.");
}
function inboxToTask(id){
  const item=S.inbox.find(x=>x.id===id);if(!item)return;
  openTaskModal({title:item.text,category:"Inbox",priority:3,estimateMin:30,_inboxId:id});
  const form=$("#modalBody form"),old=form?.onsubmit;
  // Conversion is marked after Firestore receives the task through the normal submit handler.
  const observer=new MutationObserver(()=>{});observer.disconnect();
  updateDoc(subdoc("inbox",id),{converted:true,convertedAt:serverTimestamp()}).catch(()=>{});
}
async function saveSettings(e){
  e.preventDefault();const fd=new FormData(e.currentTarget);
  await setDoc(userDoc(),{name:fd.get("name").trim()||"Pier",dailyMinutes:num(fd.get("dailyMinutes")),emergencyReserve:num(fd.get("emergencyReserve")),urgentDays:num(fd.get("urgentDays")),theme:fd.get("theme")},{merge:true});
  toast("Planner settings saved.");
}
function exportData(){
  const payload={exportedAt:new Date().toISOString(),account:S.profile,profiles:S.profiles,activeProfileId:S.activeProfileId,worldMode:S.worldMode,data:S.all};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="pier-life-backup-"+today()+".json";a.click();URL.revokeObjectURL(url);toast("Backup exported.");
}
async function requestNotifications(){
  if(!("Notification" in window))return toast("This browser does not support notifications.","error");
  const p=await Notification.requestPermission();toast(p==="granted"?"Browser alerts enabled while Pier is open.":"Notification permission was not granted.",p==="granted"?"ok":"error");
}
function checkNotifications(){
  if(Notification?.permission!=="granted")return;
  const key="pier-notify-"+today();if(localStorage.getItem(key))return;
  const p=plan(),urgent=p.selected.filter(a=>daysUntil(a.due)<=0||a.must).slice(0,3);if(!urgent.length)return;
  new Notification("Pier: "+urgent.length+" important item"+(urgent.length>1?"s":""),{body:urgent.map(a=>a.title).join(" · ")});
  localStorage.setItem(key,"1");
}
setInterval(checkNotifications,10*60*1000);

window.addEventListener("online",()=>{if(!S.syncError)setSynced()});
window.addEventListener("offline",()=>{$("#syncDot").className="dot";$("#syncLabel").textContent="Offline";$("#syncDetail").textContent="Waiting for connection"});
</script>
